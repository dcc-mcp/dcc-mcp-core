version: "3.9"

services:
  mcp-server:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DCC_MCP_HOST: "0.0.0.0"
      DCC_MCP_PORT: "8765"
    volumes:
      - ./skills:/app/skills:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/v1/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
