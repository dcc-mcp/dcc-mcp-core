tools:
  - name: greet
    description: >-
      Greet a user by name. Use to verify standalone service connectivity and
      Skill loading. Pass {"name": "YourName"}; the default is "World".
    source_file: scripts/greet.py
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 5
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
      deferred_hint: false
    input_schema:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name to greet.
          default: World
      required: []
      additionalProperties: false
    output_schema:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          properties:
            name:
              type: string
          required:
            - name
          additionalProperties: false
      required:
        - success
        - message
        - context
      additionalProperties: false
    call_examples:
      - arguments:
          name: Agent
        note: Verify the standalone service call path.
    next-tools:
      on-success: []
      on-failure: []
