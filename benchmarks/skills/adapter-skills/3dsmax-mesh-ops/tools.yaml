    call_examples:
      - arguments:
          vertices: [[0, 0, 0], [10, 0, 0], [10, 10, 0], [0, 10, 0]]
          faces: [[1, 2, 3, 4]]
          name: panel
        note: "Build a quad panel as an Editable Poly; the n-gon is fan-triangulated"

