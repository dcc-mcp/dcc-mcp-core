  - name: edit_vertices
    description: >-
      Read, move, set, or align Editable Poly vertices in world coordinates.
      move offsets by a delta, set places each vertex at an explicit world
      position, and align flattens the selection onto its mean, minimum, or
      maximum along the chosen axes. Every write is verified per vertex by
      read-back; a vertex the host kept where it was fails the call instead of
      becoming a warning on a success.
    source_file: action_edit_vertices.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [read, move, set, align]
          default: read
        node_name: {type: string, minLength: 1, maxLength: 255}
        handle: {type: integer}
        vertex_indices:
          type: array
          minItems: 1
          maxItems: 4096
          description: >-
            1-based vertex indices. Omit to act on every vertex in the node.
          items: {type: integer, minimum: 1}
        offset:
          type: array
          minItems: 3
          maxItems: 3
          description: XYZ delta for move.
          items: {type: number}
        positions:
          type: array
          minItems: 1
          maxItems: 10000
          description: Target world positions for set, one per selected vertex.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: {type: number}
        axis:
          type: string
          enum: [x, y, z, xy, xz, yz, xyz]
          default: xyz
          description: Axes to flatten for align.
        mode:
          type: string
          enum: [mean, min, max]
          default: mean
          description: Value the selection aligns to along each chosen axis.
        space:
          type: string
          enum: [world, object]
          default: world
          description: Coordinate space of offset and positions.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    # `read`, `set`, and `align` are idempotent, but `move` accumulates - two
    # identical move calls move the vertices twice - so the tool as a whole is
    # not, and an agent that retries must not assume it is.
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    intent: "Read or move Editable Poly vertices in world coordinates."
    tool_role: action
    risk: medium
    search_aliases:
      ["edit_vertices", "edit vertices", "move vertices", "align vertices", "set vertex position"]
    side_effects:
      creates: false
      modifies: true
      deletes: false
