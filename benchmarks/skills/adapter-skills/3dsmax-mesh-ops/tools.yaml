  - name: boolean_operation
    description: >-
      Run a boolean union, intersection, subtraction, or cut through the
      native Boolean / ProBoolean object, then re-adjust it later: swap an
      operand, extract one into its own node, or remove one without rebuilding
      the stack. The boolean mode and the registered operand count are both
      read back, so a mode or operand the host did not register fails the call
      instead of being reported as a warning on a successful result.
    source_file: action_boolean_operation.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            [
              create,
              set_operation,
              add_operands,
              set_operand,
              extract_operand,
              remove_operand,
              read,
            ]
          default: read
          description: >-
            create builds a new boolean from base_node plus operands; the
            other actions re-adjust an existing boolean node.
        operation:
          type: string
          enum: [union, intersection, subtraction, cut]
          description: Boolean mode; required for create and set_operation.
        node_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Existing boolean node for every action except create.
        handle:
          type: integer
          description: Existing boolean handle for every action except create.
        base_node:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            For create, the node whose geometry is the first operand. Required
            for create.
        operands:
          type: array
          minItems: 1
          maxItems: 64
          description: >-
            Operand node names, or objects of the form {"node_name": "..."} or
            {"handle": 123}. Required for create, add_operands, and
            set_operand.
          items:
            oneOf:
              - type: string
                minLength: 1
                maxLength: 255
              - type: object
                additionalProperties: false
                minProperties: 1
                maxProperties: 2
                properties:
                  node_name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  name:
                    type: string
                    minLength: 1
                    maxLength: 255
                  handle:
                    type: integer
        operand_index:
          type: integer
          minimum: 1
          maximum: 4096
          description: >-
            1-based operand slot for set_operand, extract_operand, and
            remove_operand.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional scene node name for a created boolean node.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
        data:
          type: object
    timeout_hint_secs: 30
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
    intent: "Run a native boolean and re-adjust its operands with verified readback."
    tool_role: action
    risk: high
    search_aliases:
      ["boolean_operation", "boolean", "union", "intersection", "subtract"]
    side_effects:
      creates: true
      modifies: true
      deletes: true
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ["scene_node:mesh", "modifier_stack"]
    produces: ['scene_nodes']
    undo:
      supported: true
      granularity: batch_call
      notes: >-
        One call performs several host writes with no undo hold, so the
        grouping cannot be queried. Node creation, mode write, and one registration per operand.
        Undo once, re-read the reported nodes or knots, then repeat while
        the scene still differs.
    call_examples:
      - arguments:
          action: create
          operation: subtraction
          base_node: wall_block
          operands: ["window_opening"]
          name: wall_with_opening
        note: "Subtract window_opening from wall_block through a native boolean"

  - name: create_mesh
    description: >-
      Build one Editable Poly node from explicit world-space vertices and
      ordered faces. Every vertex is read back and compared against what was
      requested, so a host that moved, merged, or dropped a vertex fails the
      call instead of returning a mesh that only looks right. Faces with more
      than three vertices are fan-triangulated and the split is reported.
    source_file: action_create_mesh.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [vertices, faces]
      properties:
        vertices:
          type: array
          minItems: 3
          maxItems: 10000
          description: >-
            World-space vertex positions, one [x, y, z] triple per vertex.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items: {type: number}
        faces:
          type: array
          minItems: 1
          maxItems: 10000
          description: >-
            Faces as 1-based indices into vertices, in winding order. Rings of
            more than three indices are fan-triangulated.
          items:
            type: array
            minItems: 3
            maxItems: 64
            items: {type: integer, minimum: 1}
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional name for the created node.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    intent: "Build an Editable Poly from explicit world-space vertices and ordered faces."
    tool_role: action
    risk: medium
    search_aliases: ["create_mesh", "create mesh", "build mesh from vertices", "editable poly from points"]
    side_effects:
      creates: true
      modifies: false
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ["scene_node:mesh"]
    produces: ["scene_nodes", "mesh_topology"]
    undo:
      supported: true
      granularity: batch_call
      notes: >-
        One call creates a node, assigns a mesh, converts it to an Editable
