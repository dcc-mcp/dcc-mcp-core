        differ. Use mesh_edit when several different component edits have to
        collapse into a single undo step.
    call_examples:
      - arguments:
          action: align
          node_name: panel
          vertex_indices: [1, 2, 3, 4]
          axis: z
          mode: min
        note: "Flatten the selected vertices onto their lowest Z"

  - name: mesh_edit
    description: >-
      Apply up to 256 Editable Poly component edits - move, set, align, weld,
      or delete vertices, delete edges, delete or detach faces, assign material
      IDs and smoothing groups - as one atomic, reversible batch. Every op is
      range-checked before the first write, the accepted ops run inside one host
      undo hold, and a failure part-way through cancels that hold so the whole
      batch rolls back. On a host that cannot open a hold the batch is refused
      unless allow_ungrouped explicitly accepts per-op undo entries, and the
      result then says it was not grouped and that the applied ops could not be
      rolled back automatically.
    source_file: action_mesh_edit.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      required: [ops]
      properties:
        node_name: {type: string, minLength: 1, maxLength: 255}
        handle: {type: integer}
        ops:
          type: array
          minItems: 1
          maxItems: 256
          description: >-
            Component edits, applied in order inside one undo hold.
          items:
            type: object
            additionalProperties: false
            required: [op, indices]
            properties:
              op:
                type: string
                enum:
                  [
                    move_vertices,
                    set_vertices,
                    align_vertices,
                    weld_vertices,
                    delete_vertices,
                    delete_edges,
                    delete_faces,
                    detach_faces,
                    set_face_material_id,
                    set_face_smoothing_group,
                  ]
              indices:
                type: array
                minItems: 1
                maxItems: 4096
                description: 1-based component indices the op acts on.
                items: {type: integer, minimum: 1}
              offset:
                type: array
                minItems: 3
                maxItems: 3
                description: XYZ delta for move_vertices.
                items: {type: number}
              positions:
                type: array
                minItems: 1
                maxItems: 10000
                description: >-
                  Target positions for set_vertices, one entry per index.
                items:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items: {type: number}
              axis:
                type: string
                enum: [x, y, z, xy, xz, yz, xyz]
                default: xyz
                description: Axes to flatten for align_vertices.
              mode:
                type: string
                enum: [mean, min, max]
                default: mean
                description: >-
                  Value the selected vertices align to along each chosen axis.
              material_id:
                type: integer
                minimum: 1
                maximum: 65535
                description: Material ID for set_face_material_id.
              smoothing_group:
                type: integer
                minimum: 0
                maximum: 32
                description: Smoothing group for set_face_smoothing_group.
              name:
                type: string
                minLength: 1
                maxLength: 255
                description: Name of the new node created by detach_faces.
              space:
                type: string
                enum: [world, object]
                default: world
                description: >-
                  Coordinate space of offset and positions. World is the
                  default and is mapped through the node transform.
        dry_run:
          type: boolean
          default: false
          description: >-
            Run the preflight and report the planned ops without writing.
        allow_ungrouped:
          type: boolean
          default: false
          description: >-
            Apply the batch even when the host cannot open an undo hold, which
            means each op may leave its own undo entry and a part-way failure
            cannot be rolled back automatically.
        label:
          type: string
          minLength: 1
          maxLength: 255
          default: mesh edit
          description: Label the host shows for the undo entry.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 120
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
    intent: "Apply a batch of component edits as one atomic, reversible step."
    tool_role: action
    risk: high
    search_aliases:
      ["mesh_edit", "mesh edit", "edit components", "batch mesh edit", "delete faces", "weld vertices"]
    side_effects:
      creates: true
      modifies: true
      deletes: true
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ["scene_node:mesh", "mesh_topology"]
    produces: ["scene_nodes", "mesh_topology", "edit_result"]
    undo:
      supported: true
      granularity: single_call
      notes: >-
        Every edit in the batch is written inside one host undo hold, so one
        undo_last reverses the whole call. undo.grouped is false only when the
        host could not open a hold, which the tool refuses unless
        allow_ungrouped is true; in that case each op may have left its own
        undo entry and a part-way failure could not be rolled back, and the
        result says so instead of claiming a clean rollback.
    call_examples:
      - arguments:
          node_name: panel
          ops:
            - {op: move_vertices, indices: [1, 2], offset: [0, 0, 5]}
            - {op: set_face_smoothing_group, indices: [1, 2], smoothing_group: 2}
          label: lift panel lip
        note: "Move two vertices and re-shade two faces as one undoable batch"

  - name: pick_component
    description: >-
      Resolve a viewport image position - or an explicit world ray - to an
      Editable Poly component: a face index, plus the nearest vertex and edge
      when asked for. The host ray cast reports the face it hit and the point
      is then checked against that face, so a face the host named but the point
      does not lie on is reported as unverified rather than trusted. A clean
      miss is a successful result with hit false. When the host exposes no
      viewport position to world ray entry point the call fails and names every
      candidate it probed; supply ray_origin and ray_direction instead, which
      needs no host mapping.
    source_file: action_pick_component.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        node_name: {type: string, minLength: 1, maxLength: 255}
        handle: {type: integer}
        use_selection:
          type: boolean
          default: false
          description: >-
            Cast at the current selection instead of an explicit node.
        image_x:
          type: number
          description: >-
            Horizontal viewport position in pixels. Requires image_y. Passed to
            the host mapping entry point unchanged; not converted.
        image_y:
          type: number
          description: >-
            Vertical viewport position in pixels. Requires image_x. Passed to
            the host mapping entry point unchanged; not converted.
        image_space:
          type: string
          enum: [pixels]
          default: pixels
          description: >-
            Unit of image_x/image_y. Only pixels is supported: the viewport
            size cannot be queried here, so normalized 0..1 coordinates cannot
            be converted and are rejected rather than passed through as
            pixels.
        ray_origin:
          type: array
          minItems: 3
          maxItems: 3
          description: >-
            World-space ray origin. Use with ray_direction when the host
            exposes no image position mapping.
          items: {type: number}
        ray_direction:
          type: array
          minItems: 3
          maxItems: 3
          description: World-space ray direction; normalized by the tool.
          items: {type: number}
        component:
          type: string
          enum: [face, vertex, edge]
          default: face
          description: >-
            Component to resolve. vertex and edge are derived from the hit
            face by proximity.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 30
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    intent: "Map an image position or a world ray onto an editable component."
    tool_role: inspection
    risk: low
    search_aliases:
      ["pick_component", "pick component", "viewport pick", "ray pick", "hit test face"]
    side_effects:
      creates: false
      modifies: false
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: []
    produces: ["component_indices", "ray_hit"]
    call_examples:
      - arguments:
          node_name: panel
          ray_origin: [0, 0, 100]
          ray_direction: [0, 0, -1]
          component: vertex
        note: "Pick the vertex nearest the point a downward ray hits on panel"
