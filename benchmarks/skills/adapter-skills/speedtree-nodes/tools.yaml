{
  "tools": [
    {
      "name": "inspect_graph",
      "description": "Read generator identities and links from a native SPM or STT; no live host probe.",
      "input_schema": {
        "type": "object",
        "required": [
          "source_path"
        ],
        "properties": {
          "source_path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        },
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "annotations": {
        "read_only_hint": true,
        "destructive_hint": false,
        "idempotent_hint": true,
        "open_world_hint": false
      },
      "execution": "sync",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "timeout_hint_secs": 30,
      "source_file": "scripts/inspect_graph.py"
    },
    {
      "name": "inspect_properties",
      "description": "Read stored scalar and curve component paths for one generator.",
      "input_schema": {
        "type": "object",
        "required": [
          "source_path",
          "node_id"
        ],
        "properties": {
          "source_path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          },
          "node_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          }
        },
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "annotations": {
        "read_only_hint": true,
        "destructive_hint": false,
        "idempotent_hint": true,
        "open_world_hint": false
      },
      "execution": "sync",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "timeout_hint_secs": 30,
      "source_file": "scripts/inspect_properties.py"
    },
    {
      "name": "discover_templates",
      "description": "Discover installed generator and project templates without copying vendor assets.",
      "input_schema": {
        "type": "object",
        "required": [
          "speedtree_root"
        ],
        "properties": {
          "speedtree_root": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        },
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "annotations": {
        "read_only_hint": true,
        "destructive_hint": false,
        "idempotent_hint": true,
        "open_world_hint": false
      },
      "execution": "sync",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "timeout_hint_secs": 30,
      "source_file": "scripts/discover_templates.py"
    },
    {
      "name": "edit_graph",
      "description": "Apply validated generator operations and write a new SPM or STT. The source is preserved; Modeler regeneration remains required.",
      "input_schema": {
        "type": "object",
        "required": [
          "source_path",
          "output_path",
          "operations"
        ],
        "properties": {
          "source_path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          },
          "output_path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          },
          "operations": {
            "type": "array",
            "minItems": 1,
            "maxItems": 256,
            "items": {
              "type": "object",
              "required": [
                "op"
              ],
              "properties": {
                "op": {
                  "type": "string",
                  "enum": [
                    "add",
                    "duplicate",
                    "remove",
                    "connect",
                    "disconnect",
                    "rename",
                    "set_hidden",
                    "set_property"
                  ]
                },
                "node_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "new_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "parent_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "source_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "target_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "template_node_id": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 128
                },
                "template_path": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 4096
                },
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 200
                },
                "component": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 4096
                },
                "value": {},
                "cascade": {
                  "type": "boolean"
                },
                "hidden": {
                  "type": "boolean"
                }
              },
              "additionalProperties": false
            }
          }
        },
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "annotations": {
        "read_only_hint": false,
        "destructive_hint": false,
        "idempotent_hint": false,
        "open_world_hint": false
      },
      "execution": "sync",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "timeout_hint_secs": 30,
      "source_file": "scripts/edit_graph.py"
    },
    {
      "name": "inspect_authoring_catalog",
      "description": "Inventory every installed generator template type and stored property name; reports failures and does not imply full Modeler coverage.",
      "input_schema": {
        "type": "object",
        "required": [
          "speedtree_root"
        ],
        "properties": {
          "speedtree_root": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4096
          }
        },
        "additionalProperties": false
      },
      "output_schema": {
        "type": "object"
      },
      "annotations": {
        "read_only_hint": true,
        "destructive_hint": false,
        "idempotent_hint": true,
        "open_world_hint": false
      },
      "execution": "sync",
      "affinity": "any",
      "enforce_thread_affinity": true,
      "timeout_hint_secs": 30,
      "source_file": "scripts/inspect_authoring_catalog.py"
    }
  ]
}
