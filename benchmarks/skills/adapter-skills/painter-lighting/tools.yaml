tools:
  - name: inspect_environment
    description: >-
      Read Painter's current environment lighting - environment map, background texture, exposure, and rotation - and report which environment capabilities the running host exposes.
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 15
    source_file: scripts/inspect_environment.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
  - name: set_environment_map
    description: Set Painter's environment map from a resource URL and confirm the change by host readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [resource_url]
      properties:
        resource_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Painter environment resource URL, as returned by painter_project__import_resource with the environment usage.
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 60
    source_file: scripts/set_environment_map.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_lighting__inspect_environment
      on-failure:
        - painter_lighting__inspect_environment
        - painter_project__search_resources
  - name: set_environment_exposure
    description: Set Painter's environment exposure in stops and confirm the change by host readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [exposure]
      properties:
        exposure:
          type: number
          minimum: -20
          maximum: 20
          description: Environment exposure in stops. Zero is the neutral value.
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/set_environment_exposure.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_lighting__inspect_environment
      on-failure:
        - painter_lighting__inspect_environment
  - name: set_environment_rotation
    description: Set Painter's environment rotation in turns and confirm the change by host readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [rotation]
      properties:
        rotation:
          type: number
          minimum: 0
          maximum: 1
          description: Environment rotation in turns, where one turn is a full revolution.
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/set_environment_rotation.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_lighting__inspect_environment
      on-failure:
        - painter_lighting__inspect_environment
