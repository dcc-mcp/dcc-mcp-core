tools:
  - name: import_to_scene
    description: Import an asset descriptor payload into 3ds Max.
    source_file: ../src/dcc_mcp_3dsmax/skills/3dsmax-import-to-scene/action_import_to_scene.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      properties:
        descriptor:
          type: object
      required: [descriptor]
      additionalProperties: true
    output_schema:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
        data:
          type: object
      additionalProperties: true
    timeout_hint_secs: 60
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
