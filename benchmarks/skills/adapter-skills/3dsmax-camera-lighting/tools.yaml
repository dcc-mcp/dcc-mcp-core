  - name: set_light_properties
    description: >-
      Adjust light properties after validating the target node: common controls
      (enabled, intensity, color, shadows) plus renderer light controls
      (shape, photometric units, emitter size, color temperature, color space).
      Every requested control is read back; a control the light rejects fails
      the call and restores the previous values.
    source_file: action_set_light_properties.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        light_name: {type: string, minLength: 1}
        light_handle: {type: integer}
        enabled: {type: boolean}
        intensity: {type: number, minimum: 0}
        color: *color_schema
        shadows: {type: boolean}
        provider: {type: string, enum: [auto, arnold, corona, photometric, vray, standard]}
        shape: {type: string, enum: [quad, rectangle, plane, disk, disc, sphere, cylinder, mesh, environment, dome]}
        shape_value: {type: integer, minimum: 0}
        units: {type: string, enum: [renderer, default, w, lm, lumen, luminous_power, cd, candela, cd_m2, luminance, lx, lux, radiance, w_sr_m2, radiant_power]}
        units_value: {type: integer, minimum: 0}
        exposure: {type: number}
        color_temperature: {type: number, minimum: 0, description: Color temperature in Kelvin.}
        size_u: {type: number, minimum: 0}
        size_v: {type: number, minimum: 0}
        radius: {type: number, minimum: 0}
        samples: {type: number, minimum: 0}
        spread: {type: number}
        normalize_color: {type: boolean}
        color_space: {type: string, minLength: 1}
    output_schema: *output_schema
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: true
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

    intent: "Adjust intensity, color, shadows, enabled state, and renderer light controls of a light."
    tool_role: action
    risk: medium
    search_aliases:
      ["set_light_properties", "set light properties", "light properties", "light shape", "light units", "kelvin"]
    side_effects:
      creates: false
      modifies: true
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ['scene_nodes']
    produces: ['scene_nodes']
