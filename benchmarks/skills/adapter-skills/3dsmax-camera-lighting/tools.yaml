      emitter shape, photometric units, Kelvin color temperature, and local
      emitter size. Pass `lights` to build up to 32 lights in one transaction;
      every requested control is read back from the host and any mismatch rolls
      the whole call back. Use `lighting_capabilities` first when the host's
      shape or unit dropdown order is unknown, or pass `shape_value` /
      `units_value` to write the native index directly.
    source_file: action_create_renderer_light.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        lights:
          type: array
          minItems: 1
          maxItems: 32
          description: One entry per light. Mutually exclusive with the flat single-light arguments.
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1}
              kind:
                type: string
                enum: [area, dome, photometric, sun, sky, omni, spot, directional, skylight]
              shape: {type: string, enum: [quad, rectangle, plane, disk, disc, sphere, cylinder, mesh, environment, dome]}
              shape_value: {type: integer, minimum: 0}
              units: {type: string, enum: [renderer, default, w, lm, lumen, luminous_power, cd, candela, cd_m2, luminance, lx, lux, radiance, w_sr_m2, radiant_power]}
              units_value: {type: integer, minimum: 0}
              position: *vector_schema
              target_position: *vector_schema
              targeted: {type: boolean}
              intensity: {type: number, minimum: 0}
              exposure: {type: number}
              color: *color_schema
              color_temperature: {type: number, minimum: 0}
              cast_shadows: {type: boolean}
              size_u: {type: number, minimum: 0}
              size_v: {type: number, minimum: 0}
              radius: {type: number, minimum: 0}
              samples: {type: number, minimum: 0}
              spread: {type: number}
              normalize_color: {type: boolean}
              texture_path: {type: string, minLength: 1}
              color_space: {type: string, minLength: 1}
              map_type: {type: string, enum: [angular, cubic, spherical, mirrored_ball, max_standard]}
              gamma: {type: number, minimum: 0}
              horizontal_rotation: {type: number}
        provider:
          type: string
          enum: [auto, arnold, corona, photometric, vray, standard]
          default: auto
        name: {type: string, minLength: 1}
        kind:
          type: string
          enum: [area, dome, photometric, sun, sky, omni, spot, directional, skylight]
        shape: {type: string, enum: [quad, rectangle, plane, disk, disc, sphere, cylinder, mesh, environment, dome]}
        shape_value: {type: integer, minimum: 0}
        units: {type: string, enum: [renderer, default, w, lm, lumen, luminous_power, cd, candela, cd_m2, luminance, lx, lux, radiance, w_sr_m2, radiant_power]}
        units_value: {type: integer, minimum: 0}
        position: *vector_schema
        target_position: *vector_schema
        targeted: {type: boolean}
        intensity: {type: number, minimum: 0}
        exposure: {type: number}
        color: *color_schema
        color_temperature: {type: number, minimum: 0}
        cast_shadows: {type: boolean}
        size_u: {type: number, minimum: 0}
        size_v: {type: number, minimum: 0}
        radius: {type: number, minimum: 0}
        samples: {type: number, minimum: 0}
        spread: {type: number}
        normalize_color: {type: boolean}
        texture_path: {type: string, minLength: 1}
        color_space: {type: string, minLength: 1}
        map_type: {type: string, enum: [angular, cubic, spherical, mirrored_ball, max_standard]}
        gamma: {type: number, minimum: 0}
        horizontal_rotation: {type: number}
