  - name: create_vray_light
    description: >-
      Create V-Ray lights (rectangle, environment/dome, sphere, disk, or mesh)
      with photometric units, targeted placement, local U/V size, and an
      optional VRayBitmap dome texture. Pass `lights` to build up to 32 lights
      in one transaction; every requested control is read back from the host
      and any mismatch rolls the whole call back.
    source_file: action_create_vray_light.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        lights:
          type: array
          minItems: 1
          maxItems: 32
          description: One entry per light. Mutually exclusive with the flat single-light arguments.
          items:
            type: object
            additionalProperties: false
            properties:
              name: {type: string, minLength: 1}
              shape: {type: string, enum: [rectangle, environment, sphere, disk, mesh]}
              position: *vector_schema
              target_position: *vector_schema
              targeted: {type: boolean}
              units: {type: string, enum: [renderer, lm, cd_m2, w, radiance]}
              multiplier: {type: number, minimum: 0}
              color: *color_schema
              cast_shadows: {type: boolean}
              normalize_color: {type: boolean}
              size_u: {type: number, minimum: 0}
              size_v: {type: number, minimum: 0}
              texture_path: {type: string, minLength: 1}
              map_type: {type: string, enum: [angular, cubic, spherical, mirrored_ball, max_standard]}
              gamma: {type: number, minimum: 0}
              color_space: {type: string, minLength: 1}
              horizontal_rotation: {type: number}
        name: {type: string, minLength: 1}
        shape: {type: string, enum: [rectangle, environment, sphere, disk, mesh]}
        position: *vector_schema
        target_position: *vector_schema
        targeted: {type: boolean}
        units: {type: string, enum: [renderer, lm, cd_m2, w, radiance]}
        multiplier: {type: number, minimum: 0}
        color: *color_schema
        cast_shadows: {type: boolean}
        normalize_color: {type: boolean}
        size_u: {type: number, minimum: 0}
        size_v: {type: number, minimum: 0}
        texture_path: {type: string, minLength: 1}
        map_type: {type: string, enum: [angular, cubic, spherical, mirrored_ball, max_standard]}
        gamma: {type: number, minimum: 0}
        color_space: {type: string, minLength: 1}
        horizontal_rotation: {type: number}
    output_schema: *output_schema
    timeout_hint_secs: 30
    read_only: false
    destructive: false
    idempotent: false
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false}

    intent: "Create verified V-Ray lights with shape, units, and HDRI dome controls."
    tool_role: action
    risk: medium
    search_aliases: ["create_vray_light", "create vray light", "vray light", "vray dome", "vray hdri"]
    side_effects:
      creates: true
      modifies: false
      deletes: true
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ['scene_node', 'light']
    produces: ['scene_node:light']

  - name: lighting_capabilities
    description: >-
      Report the light providers the active 3ds Max host can build: factory
      availability per light kind, light shapes, photometric units, renderer
      routing, and the native property candidates for every control. Pass
      `probe=true` to build one throwaway light per available factory, record
      which controls the host exposes and which enum indices it accepts, and
      then delete it again.
    source_file: action_lighting_capabilities.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        renderer:
          type: string
          minLength: 1
          description: Renderer name used for provider routing. Defaults to the active renderer.
        providers:
          type: array
          minItems: 1
          items: {type: string, enum: [arnold, corona, photometric, vray, standard]}
        probe:
          type: boolean
          default: false
          description: Build and delete one light per factory to record real host support.
    output_schema: *output_schema
    timeout_hint_secs: 30
    # probe=true builds one light per factory and deletes it again, so the tool
    # is not read-only even though the default call only reads state.
    read_only: false
    destructive: false
    idempotent: false
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: false}

    intent: "Discover which light providers, shapes, units, and controls the host supports."
    tool_role: action
    risk: medium
    search_aliases:
      ["lighting_capabilities", "lighting capabilities", "light provider", "arnold light", "corona light"]
    side_effects:
      creates: true
      modifies: true
      deletes: true
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ['scene_node', 'light']
    produces: ['lighting_capability_report']

  - name: create_renderer_light
