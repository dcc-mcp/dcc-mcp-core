tools:
  - name: inspect_material_channels
    description: >-
      List the material channels a Painter texture-set stack carries, with label, storage format, bit depth, and colour flag.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: true
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/inspect_material_channels.py
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
  - name: set_layer_channels
    description: >-
      Replace the set of material channels a Painter layer contributes, resolved against the host channel enum and confirmed by readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [layer_uid, channels]
      properties:
        layer_uid:
          type: integer
          minimum: 0
        channels:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Channel names resolved against textureset.ChannelType, for example BaseColor or Roughness.
          items:
            type: string
            minLength: 1
            maxLength: 64
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/set_layer_channels.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_material__inspect_material_channels
        - painter_project__list_layer_stack
      on-failure:
        - painter_material__inspect_material_channels
  - name: set_layer_channel_value
    description: >-
      Write one uniform value into one material channel of an existing Painter layer. Confirms channel activation only; the value itself has no host readback.
    input_schema:
      type: object
      additionalProperties: false
      required: [layer_uid, channel, value]
      properties:
        layer_uid:
          type: integer
          minimum: 0
        channel:
          type: string
          minLength: 1
          maxLength: 64
          description: Channel name resolved against textureset.ChannelType, for example Roughness.
        value:
          type: array
          minItems: 3
          maxItems: 3
          description: Uniform channel value as three components on the unit interval.
          items:
            type: number
            minimum: 0
            maximum: 1
        texture_set:
          type: string
          minLength: 1
          maxLength: 256
        stack:
          type: string
          maxLength: 256
    read_only: false
    destructive: false
    idempotent: true
    execution: async
    affinity: main
    timeout_hint_secs: 30
    source_file: scripts/set_layer_channel_value.py
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    next-tools:
      on-success:
        - painter_material__inspect_material_channels
        - painter_project__export_textures
      on-failure:
        - painter_material__inspect_material_channels
