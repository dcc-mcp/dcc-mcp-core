tools:
  - name: inspect_timeline
    description: >-
      Inspect the Nuke Studio timeline surface - open projects, sequences,
      track counts, and frame range - without changing the project. Requires
      the nukestudio host flavor; call `nuke_diagnostics__host_flavor` first
      when the entry point is unknown.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        max_sequences:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Maximum number of sequences reported per project.
    output_schema:
      type: object
      required: [read_only, host_flavor, studio_surface]
      properties:
        read_only: {type: boolean}
        host_flavor: {type: string, enum: [nuke, nukex, nukestudio]}
        studio_surface: {type: boolean}
        project_count: {type: integer}
        projects:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              sequence_count: {type: integer}
              sequences_truncated: {type: boolean}
              sequences:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    first_frame: {type: [integer, "null"]}
                    last_frame: {type: [integer, "null"]}
                    video_track_count: {type: [integer, "null"]}
                    audio_track_count: {type: [integer, "null"]}
        reason: {type: string}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    job_strategy: monolithic
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    tags: [read-only, studio, timeline]
    source_file: scripts/inspect_timeline.py
