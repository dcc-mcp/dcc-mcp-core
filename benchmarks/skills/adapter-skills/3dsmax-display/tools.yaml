    read_only: false
    destructive: false
    idempotent: true
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

    intent: "Set hidden, frozen, wire color, and display mode for target nodes."
    tool_role: action
    risk: medium
    search_aliases: ["set_node_display_state", "set node display state", "node display state"]
    side_effects:
