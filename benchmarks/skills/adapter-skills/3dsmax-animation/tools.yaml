tools:
  - name: set_keyframe
    description: >-
      Set a transform keyframe on a 3ds Max node. Use when animating position,
      rotation, or scale. Returns the node name, frame, and keyed property.
    source_file: action_set_keyframe.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      required: [node_name, time]
      additionalProperties: false
      properties:
        node_name:
          type: string
          minLength: 1
          description: Existing node name to animate.
        time:
          type: number
          description: Frame number where the key should be set.
        property:
          type: string
          enum: [position, rotation, scale]
          default: position
          description: Transform property to key.
        value:
          type: array
          minItems: 3
          maxItems: 4
          description: Transform value. Rotation accepts optional fourth quaternion component.
          items:
            type: number
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
        data:
          type: object
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

    intent: "Set a transform keyframe on a node at a specific frame."
    tool_role: action
    risk: medium
    search_aliases: ["set_keyframe", "set keyframe", "keyframe"]
    side_effects:
      creates: false
      modifies: true
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: ['scene_nodes']
    produces: ['keyframe_data']
