tools:
- name: bake_iteration_passes
  description: 'Sweep an integer iteration-count parameter and export one header-verified
    texture per pass. Designer has no dynamics solver; each pass is a deterministic
    re-evaluation at a different iteration count, not a simulated timestep.'
  input_schema:
    type: object
    additionalProperties: false
    required:
    - output_dir
    - node_id
    - parameter
    - start
    - stop
    - count
    - outputs
    - expected_graph_uid
    properties:
      output_dir:
        type: string
        maxLength: 4096
        description: Fresh directory; refused when it already exists.
      node_id:
        type: string
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      parameter:
        type: string
        maxLength: 128
        pattern: ^\$?[A-Za-z][A-Za-z0-9_.-]*$
        description: 'Integer iteration-count input, for example iterations or passes.'
      start:
        type: number
        minimum: -1000000
        maximum: 1000000
      stop:
        type: number
        minimum: -1000000
        maximum: 1000000
      count:
        type: integer
        minimum: 1
        maximum: 64
      outputs:
        type: array
        minItems: 1
        maxItems: 8
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - node_id
          - property
          properties:
            name:
              type: string
              maxLength: 128
              pattern: ^[A-Za-z][A-Za-z0-9_]{0,127}$
            node_id:
              type: string
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
            property:
              type: string
              maxLength: 128
              pattern: ^\$?[A-Za-z][A-Za-z0-9_.-]*$
      max_resolution:
        type: integer
        enum:
        - 256
        - 512
        - 1024
        - 2048
        - 4096
        default: 2048
      expected_graph_uid:
        type: string
        maxLength: 256
  output_schema:
    type: object
    required:
    - success
    - message
    properties:
      success:
        type: boolean
      message:
        type: string
      context:
        type: object
  read_only: false
  destructive: false
  idempotent: false
  execution: async
  affinity: main
  timeout_hint_secs: 600
  source_file: scripts/bake_iteration_passes.py
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
  call_examples:
  - arguments:
      output_dir: D:/work/rock/erosion_passes
      node_id: '1581078951'
      parameter: iterations
      start: 0
      stop: 12
      count: 7
      outputs:
      - name: erosion
        node_id: '1581078951'
        property: output
      expected_graph_uid: d3f1c2a4-0000-0000-0000-000000000000
      max_resolution: 2048
    note: Bake erosion at seven iteration counts to choose the right accumulation depth.
