tools:
  - name: ping
    description: Prove that Painter's main-thread bridge can execute a fresh read-only request.
    input_schema:
      type: object
      properties: {}
      additionalProperties: false
    output_schema:
      type: object
      required: [success, message, prompt, error, context]
      properties:
        success: {type: boolean, const: true}
        message: {type: string}
        prompt: {type: [string, "null"]}
        error: {type: [string, "null"]}
        context:
          type: object
          required:
            - host_dispatch_ready
            - host
            - host_pid
            - host_executable
            - process_start_identity
            - adapter_version
            - core_version
            - adapter_module_path
            - core_module_path
            - bootstrap_module_path
          properties:
            host_dispatch_ready: {type: boolean, const: true}
            host: {type: string, const: substance3d_painter}
            host_pid: {type: integer, minimum: 1}
            host_executable: {type: string, minLength: 1}
            process_start_identity: {type: string, minLength: 1}
            adapter_version: {type: string, minLength: 1}
            core_version: {type: string, minLength: 1}
            adapter_module_path: {type: string, minLength: 1}
            core_module_path: {type: string, minLength: 1}
            bootstrap_module_path: {type: string, minLength: 1}
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    source_file: scripts/ping.py
    next-tools:
      on-failure: [dcc_diagnostics__audit_log]
