tools:
  - name: create_standard_material
    description: >-
      Create a Standard material in the current 3ds Max scene. Use when the
      user asks for a simple diffuse/specular material. Returns material name,
      diffuse color, specular color, and glossiness.
    source_file: action_create_standard_material.py
    execution: sync
    affinity: main
    input_schema:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          default: StandardMat
          description: Name for the new material.
        diffuse:
          type: array
          minItems: 3
          maxItems: 3
          description: Diffuse RGB color components from 0 to 255.
          items:
            type: number
            minimum: 0
            maximum: 255
        specular:
          type: array
          minItems: 3
          maxItems: 3
          description: Specular RGB color components from 0 to 255.
          items:
            type: number
            minimum: 0
            maximum: 255
        glossiness:
          type: number
          minimum: 0
          maximum: 100
          default: 10.0
          description: Standard material glossiness value.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        status:
          type: string
        message:
          type: string
        data:
          type: object
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false

    intent: "Create a Standard material with diffuse, specular, and glossiness."
    tool_role: action
    risk: medium
    search_aliases: ["create_standard_material", "create standard material", "standard material"]
    side_effects:
      creates: true
      modifies: false
      deletes: false
      exports: false
      imports: false
      file_output: false
      render: false
      targets: []
    produces: ['material']
