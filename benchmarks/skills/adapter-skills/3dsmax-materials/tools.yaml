  - name: assign_bitmap_texture
    description: >-
      Assign a bitmap texture path to a material map slot. The slot is resolved
      through the renderer-native property (VRayMtl texmap_*, Arnold, Physical)
      and verified by readback; a slot the material does not expose fails the
      call instead of reporting a silent success.
    source_file: action_assign_bitmap_texture.py
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    input_schema:
      type: object
      required: [material_name, slot, texture_path]
      additionalProperties: false
      properties:
        material_name: {type: string, minLength: 1}
        slot:
          type: string
          enum: [diffuse, base_color, normal, bump, roughness, metalness, opacity, displacement, specular, emission, reflection, refraction, glossiness]
        texture_path: {type: string, minLength: 1}
        renderer: {type: string, enum: [auto, vray, arnold, physical, standard], default: auto}
        allow_missing: {type: boolean, default: false}
        wrap_normal:
          type: boolean
          default: true
          description: Wrap normal maps in the native Normal Bump texmap.
    output_schema:
      type: object
      additionalProperties: true
      properties:
        success: {type: boolean}
        status: {type: string}
        message: {type: string}
        data: {type: object}
    timeout_hint_secs: 15
    read_only: false
    destructive: false
    idempotent: true
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false}

    intent: "Assign a bitmap texture file to a renderer-native material slot."
