tools:
- name: export_status
  description: Read per-tree progress and the core job identity from an atomic export manifest.
  source_file: scripts/export_status.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  timeout_hint_secs: 30
  input_schema:
    type: object
    required: [manifest_path]
    properties:
      manifest_path: {type: string, minLength: 1}
    additionalProperties: false
  output_schema: {type: object}
- name: plan_import
  description: Verify a bundle and prepare a target adapter handoff without importing or configuring plugins.
  source_file: scripts/plan_import.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  timeout_hint_secs: 30
  input_schema:
    type: object
    required: [manifest_path, target]
    properties:
      manifest_path: {type: string, minLength: 1}
      target: {type: string, enum: [unreal, blender, maya, 3dsmax, houdini, unity]}
    additionalProperties: false
  output_schema:
    type: object
- name: export_batch
  description: Export selected SPM trees using the official Games or VFX CLI with input hashes
    and new per-tree output folders.
  source_file: scripts/export_batch.py
  execution: async
  requires_in_process: true
  affinity: any
  enforce_thread_affinity: true
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
    deferred_hint: true
  timeout_hint_secs: 10000
  input_schema:
    type: object
    required:
    - source_paths
    - preset_path
    - output_dir
    properties:
      source_paths:
        type: array
        minItems: 1
        maxItems: 16
        items:
          type: string
          minLength: 1
      preset_path:
        type: string
        minLength: 1
      output_dir:
        type: string
        minLength: 1
      format:
        type: string
        enum:
        - st9
        - st
        - fbx
        - obj
        - abc
        - usd
        default: st9
      timeout_seconds:
        type: integer
        minimum: 1
        maximum: 600
        default: 300
    additionalProperties: false
  output_schema:
    type: object
- name: verify_export
  description: Recheck exported mesh and dependency inventory hashes before target DCC
    import.
  source_file: scripts/verify_export.py
  execution: sync
  affinity: any
  enforce_thread_affinity: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
  timeout_hint_secs: 45
  input_schema:
    type: object
    required:
    - manifest_path
    properties:
      manifest_path:
        type: string
    additionalProperties: false
  output_schema:
    type: object
