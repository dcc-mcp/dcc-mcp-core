tools:
  - name: snapshot
    description: >-
      Capture a bounded ui_control snapshot from the scoped application window.
      For authorized foreground interaction, start with prepare_foreground;
      this snapshot does not restore or activate a window. Use its snapshot_id when acting so
      stale controls can be detected. On Windows, DccServerBase automatically
      supplies its trusted adapter PID/HWND/title context. Dedicated servers
      can bind the DCC through DCC_MCP_UI_CONTROL_PROCESS_ID or
      DCC_MCP_UI_CONTROL_WINDOW_HANDLE. A request title can narrow a trusted PID
      to one window, and all request scope can only narrow the binding. A
      locked, disconnected, or secure Windows desktop returns
      desktop_unavailable without ending the logical session. After unlock,
      discard old ids and take a fresh snapshot to restore the capsule.
      Coordinates belong only to this adapter host and DCC logon session;
      RDP/session or monitor topology, resolution, and DPI changes require a
      fresh snapshot. A bounded target may span monitors whose virtual-desktop
      origins are negative or whose DPI differs; action coordinates remain
      PNG-relative.
      An owner-selected pixels_only MCP runtime returns no AX tree: snapshot_id
      is the native observation_id. Preserve the returned native provenance;
      use one authorized physical act followed by a fresh snapshot. Callers
      cannot select a runtime or action grant.
    input_schema:
      type: object
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        process_id:
          type: integer
          description: "Process id that owns the scoped application window."
        window_handle:
          type: integer
          description: "Native handle of the scoped application window."
        window_title:
          type: string
          description: "Title substring for the scoped application window."
        process_name:
          type: string
          description: "Process name used to resolve the scoped application window."
        resume_computer_use:
          type: boolean
          default: false
          description: >-
            Explicitly resume native DCC UI Control after the user stopped a
            session with Esc. Agents must leave this false unless the user asks to
            resume control.
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
    read_only: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    execution: sync
    affinity: any
    source_file: scripts/snapshot.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__find
        - ui_control__act
        - ui_control__stop_computer_use

  - name: prepare_foreground
    description: >-
      Explicitly restore/activate one exact PID/HWND, read back its true foreground
      and visibility, then return a fresh same-session snapshot before authorized
      input. Use this as the first step for foreground UI interaction. Requires
      snapshot and window-mutation policy plus the owner's matching native window
      operation grant. Never changes target, resumes interrupted control, retries
      failures or sends content input. Activation success with failed capture is
      failure, with separate binding, authorization, activation, foreground_readback
      or capture stage and retained native capture reason. Other backends reject it.
    input_schema:
      type: object
      additionalProperties: false
      required: [session_id, process_id, window_handle, operation]
      properties:
        session_id:
          type: string
          minLength: 1
          maxLength: 80
        process_id:
          type: integer
          minimum: 1
        window_handle:
          type: integer
          minimum: 1
        operation:
          type: string
          enum: [activate, restore_activate]
        window_title:
          type: string
          description: "Keep any existing narrowing title constraint for this session."
        process_name:
          type: string
          description: "Optional narrowing process constraint; never changes the bound PID/HWND."
        policy:
          type: object
          description: "May only restrict the existing owner policy."
    read_only: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
    execution: sync
    affinity: any
    timeout_hint_secs: 240
    source_file: scripts/prepare_foreground.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__act
        - ui_control__stop_computer_use
      on-failure:
        - ui_control__stop_computer_use
    call_examples:
      - arguments: {session_id: "editor-task", process_id: 1234, window_handle: 5678, operation: restore_activate}
        note: "Replace both identifiers with the current authorized exact target."

  - name: recording_start
    description: >-
      Start CUA recording for the exact application session. Legacy shared Host
      recording requires an absolute output_dir. Explicit owner-granted pixels
      recording uses its immutable runtime task directory and video only;
      omit output_dir and record_video in that mode. Finish with recording_stop.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        process_id:
          type: integer
          description: "Process id that owns the operator-bound exact window."
        window_handle:
          type: integer
          description: "Native handle of the operator-bound exact window."
        window_title:
          type: string
          description: "Title constraint that may only narrow the operator-bound scope."
        process_name:
          type: string
          description: "Process-name constraint that may only narrow the operator-bound scope."
        output_dir:
          type: string
          minLength: 1
          maxLength: 4096
          description: "Required absolute destination for shared Host; optional exact runtime-authorized directory for owned pixels."
        record_video:
          type: boolean
          description: "Shared Host defaults to false; owned pixels defaults to true and refuses false."
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
    read_only: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    execution: sync
    affinity: any
    source_file: scripts/recording_start.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__act
        - ui_control__recording_state
        - ui_control__recording_stop

  - name: recording_state
    description: "Read truthful active, paused, degraded, failed, or stopped CUA recording state for this session."
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
    read_only: true
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    execution: sync
    affinity: any
    source_file: scripts/recording_state.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__act
        - ui_control__recording_stop

  - name: recording_stop
    description: >-
      Stop CUA recording for this exact application session. Preserve partial
      artifacts and failure state; an error is not successful finalization.
    input_schema:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
    read_only: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    execution: sync
    affinity: any
    source_file: scripts/recording_stop.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__stop_computer_use

  - name: find
    description: >-
      Locate controls in the scoped ui_control snapshot by query, role, label, or
      object name. Returns normalized UiControlNode matches. Native CUA
      pauses with desktop_unavailable while the interactive desktop is locked,
      disconnected, or secure.
      Semantic find is unsupported when the server owner selected pixels_only.
    input_schema:
      type: object
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        process_id:
          type: integer
          description: "Process id that owns the scoped application window."
        window_handle:
          type: integer
          description: "Native handle of the scoped application window."
        window_title:
          type: string
          description: "Title substring for the scoped application window."
        process_name:
          type: string
          description: "Process name used to resolve the scoped application window."
        query:
          type: string
          description: "Text query matched against id, label, text, value, and object_name."
        role:
          type: string
          description: "Control role filter, for example button, text_field, checkbox, or label."
        label:
          type: string
          description: "Exact or case-insensitive label filter."
        object_name:
          type: string
          description: "Host object/control name filter."
        limit:
          type: integer
          description: "Maximum matches to return."
          default: 10
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
    read_only: true
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    execution: sync
    affinity: any
    timeout_hint_secs: 2
    source_file: scripts/find.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__act
        - ui_control__wait_for

  - name: act
    description: >-
      Perform one scoped semantic or DCC UI Control action. Supports control ids,
      snapshot coordinates, pointer paths, text, and key presses where the
      selected backend supports them. Request policy may narrow or deny raw
      input. Every Windows mutation requires an adapter/operator-bound PID/HWND so
      the visible capsule and user interruption monitor cover semantic UIA as
      well as raw input. Raw input is enabled by default inside that exact
      bound scope and can be disabled with DCC_MCP_CUA_ALLOW_RAW_INPUT=false.
      The default Windows semantic transport hard-denies raw type: enter non-sensitive text only through
      semantic set_text with an exact control_id. Passwords, authentication
      codes, and other credential material require a user hand-off or a
      host-owned secure credential flow. The type action is backend-specific
      to mock/CDP or the explicit owner-selected pixels MCP transport and is not
      a portable Windows action. Pixels MCP permits only the owner's physical
      action ceiling; tool policy and the operator raw-input ceiling can narrow it.
      Windows keypress rejects ordinary printable, Shift-text, and AltGr-text
      input; use only navigation/control/function keys or genuine Ctrl/Alt
      shortcuts. Windows game_navigation is the separately governed game-canvas
      path: it accepts up to four simultaneous supported canvas keys or `+`
      chords and an optional 0..500 ms hold, while preserving the existing
      raw-text denial.
      For application menu bars, invoke_menu resolves an explicit native
      menu_path inside the exact bound window. Prefer it when semantic menu
      clicks or Alt mnemonics cannot prove that a Qt popup opened; it never
      guesses pixels and always requires a fresh snapshot for verification.
      For a custom-drawn DCC canvas or face control that has no semantic node,
      use a path from the latest snapshot for one drag; Ctrl, Shift, and Alt in
      keys are held as pointer modifiers. Snapshot again immediately afterward.
      get_window_state, restore_window, show_window, and activate_window are
      recovery operations for the same host-bound PID/HWND and do not require
      a prior snapshot. They cannot enumerate or target another process/window;
      restore/show/activate invalidate any prior snapshot and are audited.
      In owner-selected pixels MCP mode, activate_window and restore_window
      require explicit owner window_operations; restore_window uses native
      restore_activate. minimize_window is available only in this mode with an
      explicit owner grant and the matching latest snapshot_id. Window changes
      never activate or capture implicitly; take fresh pixels before more input.
      set_frame is available only in owner-selected pixels MCP mode with explicit
      window_operations=set_frame. First get_window_state, then forward its
      window_state_id and a complete physical frame. This metadata token is not
      a snapshot or input token. Frame changes never activate or restore the window.
      desktop_unavailable means no Windows UI input was sent; keep the logical
      session, stop issuing UI calls, and ask the user to unlock or reconnect.
      Take a fresh snapshot only after that happens. Never
      use coordinates from the gateway, another host, or another logon session.
    input_schema:
      type: object
      required: [action]
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        process_id:
          type: integer
          description: "Process id that owns the scoped application window."
        window_handle:
          type: integer
          description: "Native handle of the scoped application window."
        window_title:
          type: string
          description: "Title substring for the scoped application window."
        process_name:
          type: string
          description: "Process name used to resolve the scoped application window."
        control_id:
          type: string
          description: "Optional control id returned by ui_control__snapshot or ui_control__find."
        action:
          type: string
          enum:
            - click
            - move
            - double_click
            - scroll
            - drag
            - raw_coordinate_click
            - type
            - keypress
            - game_navigation
            - set_text
            - toggle
            - set_checked
            - select_option
            - focus
            - keyboard_shortcut
            - invoke_menu
            - get_window_state
            - restore_window
            - show_window
            - activate_window
            - minimize_window
            - set_frame
          description: >-
            Action kind to perform. type is backend-specific to mock/CDP and
            is hard denied by the default Windows semantic backend; the explicit
            pixels MCP transport requires the owner's physical action grant.
            Otherwise use semantic set_text with
            an exact control_id for non-sensitive Windows text entry. Windows
            keypress cannot synthesize ordinary printable text. game_navigation
            accepts up to four simultaneous supported keys for a non-editable
            DCC or game canvas; it is not a text-entry action. invoke_menu uses
            menu_path and does not require a prior snapshot.
        intent:
          type: string
          enum:
            - observe
            - activate
            - navigate
            - ordinary_edit
            - login_or_permission
            - upload
            - move_or_rename
            - transmit_sensitive_data
            - delete_or_overwrite
            - install_or_execute_download
            - financial_transaction
            - account_or_access_change
            - external_communication
            - terminal_or_run_dialog
            - credential_or_authentication
            - windows_security_or_privacy
            - safety_bypass
            - password_change
            - escape_scope
          description: >-
            Consequence classification hint. It can only raise the native host
            policy tier; host UIA/target/input classification remains authoritative.
        text:
          type: string
          maxLength: 4096
          description: >-
            Non-sensitive text for semantic set_text with an exact control_id,
            or explicitly owner-granted pixels MCP type. The default Windows
            semantic transport hard-denies raw type; mock/CDP support is backend-specific.
            passwords and authentication data require secure user/host hand-off.
        checked:
          type: boolean
          description: "Explicit checked state for set_checked."
        x:
          type: number
          description: "Horizontal coordinate in the latest screenshot from this adapter host/session."
        y:
          type: number
          description: "Vertical coordinate in the latest screenshot from this adapter host/session."
        button:
          type: string
          description: "Mouse button, such as left, middle, or right."
        scroll_x:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
          description: "Horizontal wheel delta; positive scrolls right and negative scrolls left."
        scroll_y:
          type: integer
          minimum: -2147483648
          maximum: 2147483647
          description: "Vertical wheel delta; positive scrolls down and negative scrolls up."
        path:
          type: array
          minItems: 2
          maxItems: 256
          description: >-
            Ordered points from the latest screenshot on this adapter
            host/session. Use for custom-drawn controls only when semantic
            lookup fails; one native action consumes this observation.
          items:
            type: object
            required: [x, y]
            properties:
              x:
                type: number
              y:
                type: number
        keys:
          type: array
          maxItems: 16
          description: >-
            Windows keypress accepts navigation/control/function keys or genuine
            Ctrl/Alt shortcuts; Ctrl/Shift/Alt may also modify pointer actions.
            game_navigation accepts up to four simultaneous canvas keys,
            including letters, digits, modifiers, navigation, and F1-F24.
          items:
            type: string
            maxLength: 32
        menu_path:
          type: array
          minItems: 1
          maxItems: 16
          description: >-
            Exact top-to-leaf native application menu labels for invoke_menu.
            Missing or ambiguous levels fail closed. Take a fresh snapshot and
            verify the popup or resulting application state after invocation.
          items:
            type: string
            minLength: 1
            maxLength: 200
        duration_ms:
          type: integer
          minimum: 0
          maximum: 60000
          description: >-
            Optional drag duration, or visible system-cursor travel plus
            pointer-effect dwell for a non-drag pointer action, in
            milliseconds. For game_navigation it is an optional key hold and
            must be between 0 and 500 ms.
        snapshot_id:
          type: string
          description: >-
            Snapshot id from observation. A stale semantic control returns
            stale_control; stale native coordinates return stale_observation.
            Display topology, resolution, or DPI changes require a new id.
        window_state_id:
          type: string
          minLength: 1
          description: >-
            Latest exact native metadata id returned by get_window_state, required
            only for set_frame. It is single-use and cannot authorize content input.
        frame:
          type: object
          required: [x, y, width, height]
          additionalProperties: false
          description: >-
            Complete physical Win32 outer window frame for set_frame, without
            activation or restore. Negative monitor coordinates are supported.
            Both x+width and y+height must fit signed 32-bit coordinates.
          properties:
            x:
              type: integer
              minimum: -2147483648
              maximum: 2147483647
            y:
              type: integer
              minimum: -2147483648
              maximum: 2147483647
            width:
              type: integer
              minimum: 1
              maximum: 2147483647
            height:
              type: integer
              minimum: 1
              maximum: 2147483647
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
      allOf:
        - if:
            properties:
              action:
                const: set_frame
            required: [action]
          then:
            required: [window_state_id, frame]
    read_only: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: false
    timeout_hint_secs: 130
    execution: sync
    affinity: any
    source_file: scripts/act.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__wait_for
        - ui_control__snapshot
        - ui_control__stop_computer_use

  - name: stop_computer_use
    description: >-
      Stop the native DCC UI Control session for one ui_control session id, remove
      its visible corner brackets/capsule, release the global input owner, and invalidate
      the latest observation. This remains safe while the desktop is
      unavailable and does not clear a Esc interruption latch.
    input_schema:
      type: object
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
    read_only: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    execution: sync
    affinity: any
    source_file: scripts/stop_computer_use.py
    requires_in_process: true

  - name: wait_for
    description: >-
      Poll the scoped UI inside one tool call until a condition becomes
      true or times out. Use after ui_control__act before verifying with snapshot.
      A Windows lock, disconnect, or secure desktop pauses live UIA and returns
      desktop_unavailable; do not poll the lock screen.
    input_schema:
      type: object
      required: [condition]
      properties:
        session_id:
          type: string
          description: "ui_control session id. Defaults to 'default'."
        process_id:
          type: integer
          description: "Process id that owns the scoped application window."
        window_handle:
          type: integer
          description: "Native handle of the scoped application window."
        window_title:
          type: string
          description: "Title substring for the scoped application window."
        process_name:
          type: string
          description: "Process name used to resolve the scoped application window."
        condition:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [control_exists, control_missing, text_equals, value_equals, checked_equals, enabled, disabled, focused]
            control_id:
              type: string
            query:
              type: string
            role:
              type: string
            label:
              type: string
            text:
              type: string
            value:
              type: string
            checked:
              type: boolean
            timeout_ms:
              type: integer
              default: 5000
              minimum: 0
              maximum: 60000
            interval_ms:
              type: integer
              default: 100
        policy:
          type: object
          description: "Optional ui_control policy override for this call."
    read_only: true
    idempotent: false
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: false
    execution: sync
    affinity: any
    timeout_hint_secs: 65
    source_file: scripts/wait_for.py
    requires_in_process: true
    next-tools:
      on-success:
        - ui_control__snapshot
        - ui_control__stop_computer_use
