name: 'Build Wheel'
description: 'Build dcc-mcp-core wheel with maturin'

inputs:
  target:
    description: 'Target platform'
    required: false
    default: ''
  python-version:
    description: 'Python version'
    required: false
    default: '3.11'
  rust-version:
    description: 'Rust toolchain version'
    required: false
    default: '1.95.0'
  maturin-extra-args:
    description: 'Extra maturin args (e.g. --sdist, -i python3.7). Features
      and --release/--out are set by this action from the justfile.'
    required: false
    default: '--find-interpreter'
  test-wheel:
    description: 'Test the built wheel'
    required: false
    default: 'true'
  generate-stubs:
    description: 'Generate Python type stubs before building the wheel'
    required: false
    default: 'true'
  prebuild-admin-ui:
    description: 'Build the admin UI bundle before invoking maturin'
    required: false
    default: 'true'
  artifact-name:
    description: 'Artifact name'
    required: false
    default: 'wheels'
  use-sccache:
    description: 'Use sccache'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      # Linux py37 still comes from setup-python. Windows and macOS py37 are
      # handled by their own setup actions below: setup-python no longer
      # carries 3.7 for Windows, and CPython 3.7 predates Apple Silicon so no
      # arm64 build exists upstream at all.
      if: >-
        !(runner.os == 'Windows' && inputs.python-version == '3.7') &&
        !(runner.os == 'macOS' && inputs.python-version == '3.7')
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Windows Python 3.7
      if: runner.os == 'Windows' && inputs.python-version == '3.7'
      uses: ./.github/actions/setup-windows-python37

    - name: Setup macOS Python 3.7
      if: runner.os == 'macOS' && inputs.python-version == '3.7'
      uses: ./.github/actions/setup-macos-python37

    - name: Remove pre-installed cargo-clippy (conflict workaround)
      # GitHub-hosted runners (macOS aarch64 AND ubuntu-latest) pre-install Rust
      # with cargo-clippy. When rustup installs the pinned toolchain (rust-toolchain.toml
      # requests the clippy component) it finds 'bin/cargo-clippy' already present and
      # rolls back the whole install with:
      #   "detected conflict: 'bin/cargo-clippy'"
      # Removing the stale binaries before toolchain setup lets rustup install cleanly.
      # Using 'if: runner.os != Windows' keeps the bash-only rm command off Windows;
      # on Windows cargo-clippy is installed via dtolnay/rust-toolchain without conflict.
      if: runner.os != 'Windows'
      shell: bash
      run: rm -f ~/.cargo/bin/cargo-clippy ~/.cargo/bin/cargo-fmt || true

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-version }}
        components: clippy rustfmt
        # Cross-compiling to x86_64-apple-darwin is how the ARM64 macOS runner
        # produces the Python 3.7 wheel, so the target belongs to the action
        # rather than to any single caller. An empty target means host-only.
        targets: ${{ inputs.target == 'x86_64-apple-darwin' && 'x86_64-apple-darwin' || '' }}

    - name: Install vx
      uses: loonghao/vx@v0.9.34
      with:
        version: "0.9.34"
        cache-key-prefix: "vx-tools-v0.9.34"
        cache: "false"

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: rust-${{ runner.os }}
        shared-key: rust-${{ runner.os }}

    - name: Resolve features from justfile
      id: resolve-features
      shell: bash
      run: |
        # Single source of truth: the feature list lives in justfile.
        # Python 3.7 cannot use abi3-py38 (PyO3 requires interpreter >= 3.8).
        if [[ "${{ inputs.python-version }}" == "3.7" ]]; then
          features=$(vx just print-wheel-features-py37)
        else
          features=$(vx just print-wheel-features)
        fi
        maturin_args="${{ inputs.maturin-extra-args }}"
        if [[ "${{ runner.os }}" == "Windows" && "${{ inputs.python-version }}" != "3.7" && "$maturin_args" == "--find-interpreter" ]]; then
          # A concrete Windows interpreter overrides the abi3-py38 feature and
          # can silently downgrade the output to a version-specific wheel.
          maturin_args=""
        fi
        args="--release --out dist --features ${features} ${maturin_args}"
        echo "Resolved maturin args: ${args}"
        echo "value=${args}" >> "$GITHUB_OUTPUT"

    - name: Verify cargo is in PATH (macOS maturin fix)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # maturin calls 'cargo metadata' but on macOS cargo sometimes
        # resolves to rustup-init wrapper that hasn't been replaced yet.
        # Force rustup to install the default toolchain proxy.
        rustup show active-toolchain || rustup default stable
        hash -r 2>/dev/null || true
        # Pin CARGO/RUSTC so maturin's subprocess uses the real binary,
        # not a Homebrew shim that is actually rustup-init.
        CARGO_BIN="$(rustup which cargo 2>/dev/null || which cargo)"
        RUSTC_BIN="$(rustup which rustc 2>/dev/null || which rustc)"
        echo "CARGO=${CARGO_BIN}" >> "$GITHUB_ENV"
        echo "RUSTC=${RUSTC_BIN}" >> "$GITHUB_ENV"
        echo "cargo: ${CARGO_BIN}"
        "${CARGO_BIN}" --version

    # manylinux Docker builds do not have `vx` on PATH. Pre-bundle the Vite admin
    # UI on the GitHub runner (vx + Node from vx.toml), then tell
    # `crates/dcc-mcp-gateway-admin/build.rs` to skip `vx npm` inside the container.
    # This must run *before* stubgen: stubgen triggers `cargo` which compiles
    # `dcc-mcp-gateway` with the `admin` feature; without a pre-built bundle,
    # build.rs would invoke npm during stubgen (Windows CI failed on invalid
    # npm config / npm crashes). `DCC_MCP_ADMIN_UI_PREBUILT` in the stubgen step
    # makes build.rs reuse `generated/index.html` from this step.
    - name: Pre-build admin UI for manylinux Docker
      if: inputs.prebuild-admin-ui == 'true'
      shell: bash
      run: |
        set -eux
        for attempt in 1 2 3; do
          if vx npm --prefix admin-ui ci --ignore-scripts --include=optional; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::npm ci failed after 3 attempts"
            exit 1
          fi
          echo "::warning::npm ci attempt ${attempt}/3 failed; retrying in 15s..."
          sleep 15
        done
        # npm ci may skip transitive optional deps (npm 10.x quirk).
        # Explicitly install the platform-specific lightningcss binary.
        LIGHTNING_PKG=$(node -p "
          ({
            'linux-x64': 'lightningcss-linux-x64-gnu',
            'darwin-arm64': 'lightningcss-darwin-arm64',
            'darwin-x64': 'lightningcss-darwin-x64',
            'win32-x64': 'lightningcss-win32-x64-msvc',
            'win32-arm64': 'lightningcss-win32-arm64-msvc',
          })[process.platform+'-'+process.arch] || ''
        ")
        if [ -n "$LIGHTNING_PKG" ]; then
          vx npm --prefix admin-ui install "$LIGHTNING_PKG" --no-save --ignore-scripts
        fi
        vx npm --prefix admin-ui run build
        test -f crates/dcc-mcp-gateway-admin/src/generated/index.html

    - name: Generate type stubs
      if: inputs.generate-stubs == 'true' && inputs.python-version != '3.7'
      shell: bash
      env:
        DCC_MCP_ADMIN_UI_PREBUILT: "1"
      run: |
        # pyo3-stub-gen v0.22.x unconditionally references PyEncodingWarning,
        # which only exists in pyo3 when targeting Python >= 3.10.
        # For Python 3.7 builds, and for CI jobs that already ran the dedicated
        # stub drift check, use the committed stubs instead of regenerating them.
        vx just stubgen

    - name: Build wheel
      uses: PyO3/maturin-action@v1
      env:
        DCC_MCP_ADMIN_UI_PREBUILT: "1"
      with:
        target: ${{ inputs.target }}
        args: ${{ steps.resolve-features.outputs.value }}
        rust-toolchain: ${{ inputs.rust-version }}
        # sccache's background server can time out while starting inside the
        # short-lived manylinux container. Keep host builds cached, but make
        # Linux container builds deterministic instead of relying on a daemon.
        sccache: ${{ inputs.use-sccache == 'true' && runner.os != 'Linux' }}
        # Core Python 3.7 wheels are part of the old-DCC compatibility surface.
        # Pin Linux builds to the manylinux2014 / glibc 2.17 baseline instead
        # of allowing the runner image to select a newer platform tag.
        manylinux: ${{ runner.os == 'Linux' && '2014' || 'auto' }}
        docker-options: -e DCC_MCP_ADMIN_UI_PREBUILT=1

    - name: Check wheel contents
      shell: bash
      run: |
        vx uvx --python 3.12 check-wheel-contents --ignore W004 dist/*.whl

    - name: Check Python compatibility wheel contract
      shell: bash
      run: |
        profile="abi3"
        case "${{ runner.os }}" in
          Linux) platform="linux-x86_64" ;;
          Windows) platform="windows-x86_64" ;;
          macOS)
            if [[ "${{ inputs.target }}" == *universal2* ]]; then
              platform="macos-universal2"
            else
              platform="macos-native"
            fi
            ;;
          *)
            echo "::error::Unsupported wheel platform: ${{ runner.os }}"
            exit 1
            ;;
        esac
        if [[ "${{ inputs.python-version }}" == "3.7" ]]; then
          profile="native_py37"
          case "${{ runner.os }}" in
            Linux|Windows) ;;
            macOS)
              # CPython 3.7 has no ARM64 macOS build, so the only contracted
              # macOS cp37 wheel is the x86_64 one cross-compiled on the ARM64
              # runner. An ARM64 or universal2 tag means maturin resolved the
              # host architecture instead of --target and must fail here.
              # This target check is macOS-specific: Linux and Windows lanes
              # pass their own target values (x64, x86_64-*) and must not be
              # validated against the Apple triple.
              if [[ "${{ inputs.target }}" == "x86_64-apple-darwin" ]]; then
                platform="macos-x86_64"
              else
                echo "::error::macOS Python 3.7 wheels must target x86_64-apple-darwin, got '${{ inputs.target }}'"
                exit 1
              fi
              ;;
            *)
              echo "::error::Native Python 3.7 wheels are not contracted for ${{ runner.os }}"
              exit 1
              ;;
          esac
        fi
        ${{ inputs.python-version == '3.7' && 'python3.7' || 'python' }} scripts/ci/check_python_wheel.py \
          --profile "$profile" \
          --platform "$platform" \
          dist/*.whl

    - name: Test zero-backport Python 3.7 wheel
      if: inputs.python-version == '3.7'
      shell: bash
      run: |
        if [[ -f tests/test_issue_2388_zero_typing_extensions.py ]]; then
          ${{ inputs.python-version == '3.7' && 'python3.7' || 'python' }} scripts/ci/smoke_zero_typing_extensions.py --wheel 'dist/*.whl'
        fi

    - name: Test wheel
      if: inputs.test-wheel == 'true'
      shell: bash
      run: |
        # macOS can still resolve bare `python` to the runner's interpreter,
        # so select the installed native 3.7 explicitly on non-Windows lanes.
        # Windows must use the original python.exe name: its python3.7 copy
        # breaks CPython 3.7 venv's sys._base_executable lookup (WinError 2).
        #
        # On macOS the runner is arm64 while the cp37 wheel is the x86_64
        # cross-compiled one (CPython 3.7 predates Apple Silicon, so no arm64
        # interpreter exists upstream and no arm64 wheel is contracted). A venv
        # created without `arch -x86_64` is bound to the arm64 slice, so pip
        # inside it rejects the wheel with "not a supported wheel on this
        # platform": pip derives the platform tag from the RUNNING interpreter's
        # architecture. Rosetta 2 does not help on its own -- it only translates
        # processes that explicitly request translation.
        if [[ "${{ inputs.python-version }}" == "3.7" && "${{ runner.os }}" == "macOS" ]]; then
          arch -x86_64 python3.7 -m venv test-env
        elif [[ "${{ inputs.python-version }}" == "3.7" && "${{ runner.os }}" != "Windows" ]]; then
          python3.7 -m venv test-env
        else
          python -m venv test-env
        fi
        if [ "${{ runner.os }}" = "Windows" ]; then
          source test-env/Scripts/activate
        else
          source test-env/bin/activate
        fi
        # A venv created under Rosetta still runs arm64 when the shell that
        # spawned it is arm64: `source` only rewrites PATH, it does not change
        # the architecture the subsequent processes are translated to. Every
        # command in this step whose platform tag or imported extension depends
        # on the architecture therefore needs the explicit x86_64 prefix too.
        rosetta="false"
        if [[ "${{ inputs.python-version }}" == "3.7" && "${{ runner.os }}" == "macOS" ]]; then
          rosetta="true"
        fi

        # A brand-new py37 venv does not inherit the setup action's upgraded
        # pip: CPython 3.7.9 seeds pip 20.1.1 through ensurepip. Upgrade before
        # installing the wheel, while retaining the Python 3.7-compatible
        # ceiling used by the setup actions (pip 24.1+ drops Python 3.7).
        #
        # Upgrade through `python -m pip`, not the `pip` shim: the console
        # script is a copy of pip.exe inside the venv, so replacing it while
        # that process is running fails with WinError 5 (access denied).
        if [[ "$rosetta" == "true" ]]; then
          arch -x86_64 python -m pip install --upgrade "pip<24.1" wheel
          arch -x86_64 python -m pip --version
          arch -x86_64 pip install --force-reinstall dist/*.whl
          arch -x86_64 pip check
        else
          python -m pip install --upgrade "pip<24.1" wheel
          python -m pip --version
          pip install --force-reinstall dist/*.whl
          pip check
        fi

        if [[ "${{ inputs.python-version }}" == "3.7" ]]; then
          if [[ "$rosetta" == "true" ]]; then
            arch -x86_64 python scripts/ci/smoke_python37_runtime.py --profile native_py37
          else
            python scripts/ci/smoke_python37_runtime.py --profile native_py37
          fi
        else
          python tests/test_imports.py
        fi

    - name: Upload wheel
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/
        retention-days: 30
