name: Release Please PR Guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  validate-release-pr:
    name: Validate release PR metadata
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release-please--branches--main'))
      ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion != 'skipped' &&
       startsWith(github.event.workflow_run.head_branch, 'release-please--branches--main'))
    steps:
      # fetch-depth 0: the notes gate walks the full history between the
      # previous release tag and this PR head, and a shallow clone cannot
      # resolve that range.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}

      - name: Check release-please PR consistency
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
          PR_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: python scripts/ci/check_release_please_pr.py

      # Cross-check the generated notes against the commits in the release
      # window. Catches two silent-loss mechanisms observed in v0.20.34: a
      # squash title without a conventional-commit type (release-please drops
      # the commit outright) and a visible commit that landed after the notes
      # were last regenerated.
      - name: Collect the release notes release-please generated
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Best effort: when the PR is already merged the body is gone, and
          # the CHANGELOG.md section at the head carries the same notes.
          if gh pr view "$PR_HEAD_REF" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md; then
            echo "Read the release PR body for $PR_HEAD_REF"
          else
            echo "::warning::Could not read the release PR body for $PR_HEAD_REF; checking the CHANGELOG section only"
            rm -f release-notes.md
          fi

      - name: Cross-check the release notes against the release commits
        run: |
          set -euo pipefail
          notes_args=()
          if [ -s release-notes.md ]; then
            notes_args=(--notes-file release-notes.md)
          fi
          python scripts/ci/check_release_notes.py \
            --release-tag "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}" \
            "${notes_args[@]}" \
            --include-changelog
