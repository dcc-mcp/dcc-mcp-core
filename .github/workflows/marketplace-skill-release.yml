name: Marketplace Skill Release

# Packs the publishable skills into reproducible zip archives with a pinned
# SHA-256, then renders and validates their marketplace catalog entries.
# Publication to the official registry is a separate manual step; this job
# only produces and checks the artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped on the archive names and entries
        required: true
      upload_release:
        description: Upload archives to the matching GitHub Release
        type: boolean
        default: false
      check_version_drift:
        description: Fail if a skill's digest changed without a version bump
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/release/pack_skill_release.py'
      - 'scripts/release/render_marketplace_entry.py'
      - 'scripts/release/marketplace_entry_map.json'
      - '.github/workflows/marketplace-skill-release.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/release/pack_skill_release.py'
      - 'scripts/release/render_marketplace_entry.py'
      - 'scripts/release/marketplace_entry_map.json'
      - '.github/workflows/marketplace-skill-release.yml'

permissions:
  contents: write

jobs:
  pack:
    # Cross-OS reproducibility is checked by comparing digests across this
    # matrix, so packing must run on each OS in the comparison. A single-OS
    # self-comparison cannot see host-dependent fields such as the zip
    # `create_system` byte.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        # Pinned to the same floor as the `test` extra in pyproject.toml so CI
        # validates against a jsonschema line the package itself supports.
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.18"

      - name: Resolve version
        id: version
        # Defaults to bash explicitly: this matrix includes windows-latest,
        # where the runner default shell is PowerShell. The logic is Python so
        # it stays portable; the heredoc is the part that needs bash.
        # Routed through env: rather than interpolated into the script body
        # because `${{ }}` expands before the interpreter parses, so a
        # free-text input spliced into a script is code, not data.
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib, pathlib

          raw = os.environ.get("INPUT_VERSION", "").strip()
          if raw:
              value, origin = raw, "workflow input"
          else:
              text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
              value = tomllib.loads(text)["project"]["version"]
              origin = "pyproject.toml"

          # The version names the release asset, so reject anything that could
          # escape the intended path shape.
          if not re.fullmatch(r"[0-9A-Za-z.+-]+", value):
              sys.exit("bad version from {}: {!r}".format(origin, value))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("value={}\n".format(value))
          print("resolved version {} from {}".format(value, origin))
          PY

      - name: Pack skill bundles
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python scripts/release/pack_skill_release.py --all --exclude dcc-cua --version "$VERSION" --out dist/marketplace --manifest dist/marketplace/manifest.json

      - name: Verify archives are reproducible
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys

          version = os.environ["VERSION"]
          dist = pathlib.Path("dist/marketplace")
          command = [
              sys.executable, "scripts/release/pack_skill_release.py",
              "--all", "--exclude", "dcc-cua",
              "--version", version,
              "--out", "dist/marketplace",
              "--manifest", (dist / "manifest.json").as_posix(),
          ]

          # Orthogonal to the cross-OS check below: this catches non-deterministic
          # inputs on one host, not host-dependent zip metadata.
          first_path = dist / "first.json"
          shutil.copyfile(dist / "manifest.json", first_path)
          subprocess.run(command, check=True)

          def digests(path):
              skills = json.loads(path.read_text(encoding="utf-8"))["skills"]
              return {s["skill"]: s["sha256"] for s in skills}

          first, second = digests(first_path), digests(dist / "manifest.json")
          drifted = sorted(k for k in first if first[k] != second.get(k))
          if drifted:
              print("non-reproducible archives: " + ", ".join(drifted))
              sys.exit(1)
          print("all {} archives reproducible on this host".format(len(first)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          # One artifact per OS; the cross-os job compares them below.
          name: marketplace-manifest-${{ matrix.os }}
          path: dist/marketplace/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-skill-bundles-${{ matrix.os }}
          path: dist/marketplace/*.zip

      - name: Render catalog entries
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, subprocess, sys

          version = os.environ["VERSION"]
          subprocess.run([
              sys.executable, "scripts/release/render_marketplace_entry.py",
              "--manifest", "dist/marketplace/manifest.json",
              "--base-url", "https://github.com/{}/releases/download/v{}".format(
                  os.environ["REPOSITORY"], version),
              # Only a fallback for skills that declare no compatibility floor.
              "--min-core-version", version,
              "--out", "dist/marketplace/entries.json",
          ], check=True)
          PY

      - name: Validate entries against the marketplace schema
        shell: bash
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          from jsonschema import Draft202012Validator

          schema_url = "https://raw.githubusercontent.com/dcc-mcp/marketplace/main/schemas/marketplace-v1.schema.json"
          schema = json.load(urllib.request.urlopen(schema_url))
          validator = Draft202012Validator(
              {"$ref": "#/$defs/skillEntry", "$defs": schema["$defs"]}
          )

          entries = json.load(open("dist/marketplace/entries.json"))
          failures = []
          for entry in entries:
              errors = sorted(validator.iter_errors(entry), key=lambda e: list(map(str, e.path)))
              if errors:
                  failures.append((entry["name"], [e.message for e in errors[:3]]))

          for name, messages in failures:
              print("INVALID " + name)
              for message in messages:
                  print("  - " + message)
          if failures:
              sys.exit(1)
          print("all {} entries valid against marketplace-v1.schema.json".format(len(entries)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-entries-${{ matrix.os }}
          path: dist/marketplace/entries.json

  cross-os:
    # The gate the single-host check structurally cannot be: packing the same
    # tree on two operating systems must yield identical digests, or a
    # published pin is only verifiable on the OS that produced it.
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marketplace-manifest-*
          path: manifests
          merge-multiple: false

      - name: Compare digests across operating systems
        run: |
          python - <<'PY'
          import json, pathlib, sys

          manifests = sorted(pathlib.Path("manifests").iterdir())
          digests = {}
          for directory in manifests:
              path = directory / "manifest.json"
              if not path.is_file():
                  continue
              skills = json.loads(path.read_text(encoding="utf-8"))["skills"]
              digests[directory.name] = {s["skill"]: s["sha256"] for s in skills}

          if len(digests) < 2:
              print("need manifests from at least 2 operating systems, got {}".format(len(digests)))
              sys.exit(1)

          names = sorted(digests)
          base = digests[names[0]]
          drifted = set()
          for other in names[1:]:
              for skill, digest in base.items():
                  if digests[other].get(skill) != digest:
                      drifted.add(skill)

          for name in names:
              print("{}: {} skill(s)".format(name, len(digests[name])))

          if drifted:
              print("\narchives differ across operating systems: " + ", ".join(sorted(drifted)))
              for skill in sorted(drifted):
                  for name in names:
                      print("  {} {}: {}".format(skill, name, digests[name].get(skill)))
              sys.exit(1)

          print("\nall {} archives reproducible across {}".format(len(base), ", ".join(names)))
          PY

  version-drift:
    # A published digest is pinned by the marketplace, so skill content that
    # changes without a version bump silently breaks installs: the pinned
    # sha256 no longer matches. Fail loudly and name the skill instead.
    needs: pack
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_version_drift }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib, pathlib

          raw = os.environ.get("INPUT_VERSION", "").strip()
          if raw:
              value = raw
          else:
              text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
              value = tomllib.loads(text)["project"]["version"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("value={}\n".format(value))
          PY

      - uses: actions/download-artifact@v4
        with:
          name: marketplace-manifest-ubuntu-latest
          path: current

      - name: Compare digests and versions against the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys

          version = os.environ["VERSION"]
          current = {
              s["skill"]: (s["version"], s["sha256"])
              for s in json.loads(pathlib.Path("current/manifest.json").read_text(encoding="utf-8"))["skills"]
          }

          # The baseline is the manifest.json asset uploaded with the last
          # publish. Without one there is nothing to diff against, which is
          # the normal case for a first release.
          view = subprocess.run(
              ["gh", "release", "view", "v" + version, "--json", "assets"],
              capture_output=True, text=True,
          )
          if view.returncode != 0:
              print("no published release v{}; nothing to compare".format(version))
              sys.exit(0)

          names = {a["name"] for a in json.loads(view.stdout)["assets"]}
          if "manifest.json" not in names:
              print("release v{} has no manifest.json; nothing to compare".format(version))
              sys.exit(0)

          subprocess.run(
              ["gh", "release", "download", "v" + version,
               "-p", "manifest.json", "-D", "baseline"],
              check=True, capture_output=True, text=True,
          )
          baseline = {
              s["skill"]: (s["version"], s["sha256"])
              for s in json.loads(pathlib.Path("baseline/manifest.json").read_text(encoding="utf-8"))["skills"]
          }

          offenders = []
          for skill, (new_version, digest) in sorted(current.items()):
              if skill not in baseline:
                  continue
              old_version, old_digest = baseline[skill]
              if digest != old_digest and new_version == old_version:
                  offenders.append((skill, new_version, old_digest[:12], digest[:12]))

          if offenders:
              print("content changed but version was not bumped:")
              for skill, held, old, new in offenders:
                  print("  {} stays at {} but digest moved {} -> {}".format(skill, held, old, new))
              print("\nbump metadata.dcc-mcp.version in each SKILL.md before republishing.")
              sys.exit(1)

          print("no version drift across {} published skill(s)".format(len(baseline)))
          PY

  upload:
    needs: [pack, cross-os]
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: marketplace-skill-bundles-ubuntu-latest
          path: dist/marketplace

      - name: Upload archives to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          gh release upload "v$VERSION" dist/marketplace/*.zip --clobber
