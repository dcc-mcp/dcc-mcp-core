name: Verified component installation

on:
  pull_request:
    branches: [main]
    paths:
      - crates/dcc-mcp-updater/**
      - .github/workflows/verified-component-installation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verified-component-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Verified package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: loonghao/vx@v0.9.34
        with:
          version: "0.9.34"
          cache-key-prefix: "vx-tools-v0.9.34"
      - uses: Swatinem/rust-cache@v2
        with:
          key: verified-component-${{ runner.os }}
      - name: Test package transaction and byte admission
        run: vx cargo test --locked -p dcc-mcp-updater --lib
