name: Generated Cargo metadata sync

on:
  # Run the workflow definition from the trusted default branch; PR content
  # is data checked out explicitly below and never supplies the security gate.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "uv.lock"
      - "crates/**/Cargo.toml"
      - "pyproject.toml"
      - "release-please-config.json"
      - "scripts/ci/generated_lock_sync.py"
      - ".github/workflows/release-please-lock-sync.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-cargo-metadata:
    name: Sync generated Cargo metadata
    runs-on: ubuntu-latest
    env:
      TRUSTED_VALIDATOR_REF: b8e294e8a64abba426871b1e86eb106e75aab075
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
         startsWith(github.event.pull_request.title, 'chore(main): release ')) ||
        startsWith(github.event.pull_request.head.ref, 'renovate/')
      )
    steps:
      - uses: actions/checkout@v6
        name: Checkout trusted lock validator
        with:
          ref: b8e294e8a64abba426871b1e86eb106e75aab075
          path: trusted-lock-validator
          persist-credentials: false

      - name: Verify single-file trusted lock validator object
        shell: bash
        run: |
          set -euo pipefail
          # Every execution below pipes this same pinned, self-contained object.
          git -C trusted-lock-validator cat-file -e "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py"

      - uses: actions/checkout@v6
        name: Checkout pull request head
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the PR-controlled checkout separate from the pinned trusted
          # validator checkout above. actions/checkout cleans its target path
          # by default; using an explicit sibling path prevents it from
          # deleting trusted-lock-validator.
          path: pull-request
          persist-credentials: false

      - name: Validate checkout remote
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: pull-request
        run: |
          set -euo pipefail
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - validate-remote

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: loonghao/vx@v0.9.11
        with:
          version: "0.9.11"
          cache-key-prefix: "vx-tools-v0.9.7"

      # Pinned for the same reason as ci.yml: unpinned cargo-hakari floats to
      # the latest release, and 0.9.39+ generates a different workspace-hack
      # than the committed artifact. See .github/workflows/ci.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari@0.9.38

      - name: Resolve current pull request head
        working-directory: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Release automation force-pushes its branch in bursts, and the run
          # that survives the concurrency group is not always the newest
          # delivery: a run once won with a stale head SHA, cancelled the run
          # carrying the current head, failed identity revalidation, and left
          # the release PR with unsynced locks. Re-read the head from the API
          # and check it out so generation and the fixed push both target the
          # commit the branch actually points at. Identity is still bound to
          # the event's repository, branch, and title and re-captured by the
          # pinned validator before anything is committed or pushed.
          live_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$live_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "event head $EVENT_HEAD_SHA is stale; resolving live head $live_sha"
            git fetch --no-tags origin "refs/heads/$PR_HEAD_REF"
            git checkout --detach "$live_sha"
          fi
          observed_sha="$(git rev-parse HEAD)"
          if [ "$observed_sha" != "$live_sha" ]; then
            echo "::error::resolved head $live_sha is not checked out (HEAD is $observed_sha)"
            exit 1
          fi
          {
            printf 'PR_HEAD_SHA=%s\n' "$live_sha"
            printf 'EXPECTED_HEAD_SHA=%s\n' "$live_sha"
          } >> "$GITHUB_ENV"

      - name: Sync generated lock metadata
        working-directory: pull-request
        run: |
          set -euo pipefail
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - generate

      - name: Revalidate pull request identity and generated diff
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        working-directory: pull-request
        run: |
          set -euo pipefail
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - preflight
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - verify-diff

      - name: Commit and push changes
        id: commit
        working-directory: pull-request
        run: |
          if git diff --quiet -- Cargo.lock uv.lock crates/workspace-hack/Cargo.toml; then
            echo "Generated lock metadata is already in sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "loonghao"
          git config user.email "hal.long@outlook.com"
          git add Cargo.lock uv.lock crates/workspace-hack/Cargo.toml
          git commit --no-verify -m "chore(ci): sync generated lock metadata"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push fixed generated lock commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA || github.event.pull_request.head.sha }}
        working-directory: pull-request
        run: |
          set -euo pipefail
          # Re-capture remote identity without passing the write token to the
          # validation child processes, then enforce the immutable lease.
          env -u PUSH_TOKEN git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | env -u PUSH_TOKEN python -I - validate-remote
          env -u PUSH_TOKEN git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | env -u PUSH_TOKEN python -I - remote-preflight
          env -u PUSH_TOKEN git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | env -u PUSH_TOKEN python -I - verify-commit
          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT
          chmod 600 "$credential_file"
          printf 'https://x-access-token:%s@github.com\n' '${{ secrets.PERSONAL_ACCESS_TOKEN }}' > "$credential_file"
          # Reset repository-local helpers before installing the ephemeral
          # trusted store helper.  This prevents PR-controlled
          # credential.helper=!… entries from executing during push.
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY \
            -u ALL_PROXY -u all_proxy \
            git -c http.proxy= \
            -c https.proxy= \
            -c core.gitProxy= \
            -c credential.helper= \
            -c credential.helper="store --file=${credential_file}" \
            push --no-verify --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD_SHA}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
