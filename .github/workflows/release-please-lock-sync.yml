name: Generated Cargo metadata sync

on:
  # Run the workflow definition from the trusted default branch; PR content
  # is data checked out explicitly below and never supplies the security gate.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "uv.lock"
      - "crates/**/Cargo.toml"
      - "pyproject.toml"
      - "release-please-config.json"
      - "scripts/ci/generated_lock_sync.py"
      - ".github/workflows/release-please-lock-sync.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-cargo-metadata:
    name: Sync generated Cargo metadata
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    env:
      TRUSTED_VALIDATOR_REF: b8e294e8a64abba426871b1e86eb106e75aab075
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (startsWith(github.event.pull_request.head.ref, 'release-please--branches--main') &&
         startsWith(github.event.pull_request.title, 'chore(main): release ')) ||
        startsWith(github.event.pull_request.head.ref, 'renovate/')
      )
    steps:
      - uses: actions/checkout@v6
        name: Checkout trusted lock validator
        with:
          ref: b8e294e8a64abba426871b1e86eb106e75aab075
          path: trusted-lock-validator
          persist-credentials: false

      - name: Verify single-file trusted lock validator object
        shell: bash
        run: |
          set -euo pipefail
          # Every execution below pipes this same pinned, self-contained object.
          git -C trusted-lock-validator cat-file -e "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py"

      - uses: actions/checkout@v6
        name: Checkout pull request head
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the PR-controlled checkout separate from the pinned trusted
          # validator checkout above. actions/checkout cleans its target path
          # by default; using an explicit sibling path prevents it from
          # deleting trusted-lock-validator.
          path: pull-request
          persist-credentials: false

      - name: Validate checkout remote
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: pull-request
        run: |
          set -euo pipefail
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - validate-remote

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: loonghao/vx@v0.9.34
        with:
          version: "0.9.34"
          cache-key-prefix: "vx-tools-v0.9.34"

      # Pin cargo-hakari to the release that generated the committed
      # crates/workspace-hack/Cargo.toml, matching .github/workflows/ci.yml.
      # This workflow runs `cargo hakari generate`, so a drifting tool version
      # would rewrite the checked-in artifacts with a different output shape.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari@0.9.38

      - name: Resolve current pull request head
        working-directory: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Release automation force-pushes its branch in bursts, and the run
          # that survives the concurrency group is not always the newest
          # delivery: a run once won with a stale head SHA, cancelled the run
          # carrying the current head, failed identity revalidation, and left
          # the release PR with unsynced locks. Re-read the head from the API
          # and check it out so generation and the fixed push both target the
          # commit the branch actually points at. Identity is still bound to
          # the event's repository, branch, and title and re-captured by the
          # pinned validator before anything is committed or pushed.
          live_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$live_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "event head $EVENT_HEAD_SHA is stale; resolving live head $live_sha"
            git fetch --no-tags origin "refs/heads/$PR_HEAD_REF"
            git checkout --detach "$live_sha"
          fi
          observed_sha="$(git rev-parse HEAD)"
          if [ "$observed_sha" != "$live_sha" ]; then
            echo "::error::resolved head $live_sha is not checked out (HEAD is $observed_sha)"
            exit 1
          fi
          {
            printf 'PR_HEAD_SHA=%s\n' "$live_sha"
            printf 'EXPECTED_HEAD_SHA=%s\n' "$live_sha"
          } >> "$GITHUB_ENV"

      - name: Sync generated lock metadata
        working-directory: pull-request
        run: |
          set -euo pipefail
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - generate

      # Generation runs `cargo update -w`, `cargo hakari generate` and
      # `vx uv lock`, which take long enough that release automation can merge
      # the pull request underneath them. The generated commit can then no
      # longer be pushed to a branch that is gone, and the old code answered
      # that with `preflight`'s "pull request is no longer an open PR targeting
      # main" and exit 1. Because this job is not a required check, the locks
      # were lost silently and only resurfaced as red lanes on `main`.
      #
      # Decide where the generated artifacts can still land *before* any
      # identity check can fail: on the pull request branch when it is still
      # open, or on `main` through a repair pull request when it was merged.
      - name: Resolve generated lock target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"

          # Read the facts through a fixed-order `read` group rather than
          # `eval`: branch names come from the API and must never reach the
          # shell as code. `read` rather than `mapfile` because macOS runners
          # ship bash 3.2, where `mapfile` does not exist and this step exits
          # 127. A block scalar cannot hold dedented Python, so the extractor
          # is a single-line program. `tr -d` keeps the comparison honest when
          # the checkout carries CRLF endings, which `read -r` would keep.
          {
            read -r state
            read -r merged
            read -r base_ref
            read -r live_head
          } < <(printf '%s' "$payload" | python -c "import json, sys; p = json.load(sys.stdin); print(p.get('state') or ''); print('true' if p.get('merged') else 'false'); print((p.get('base') or {}).get('ref') or ''); print((p.get('head') or {}).get('sha') or '')" | tr -d '\r')

          if [ "$merged" = "true" ]; then
            echo "target=main" >> "$GITHUB_OUTPUT"
            echo "::warning::pull request #$PR_NUMBER was merged while the generated lock metadata was produced; the generated commit cannot be pushed to the branch and will be repaired on main instead."
          elif [ "$state" != "open" ]; then
            echo "target=abort" >> "$GITHUB_OUTPUT"
            echo "reason=pull request #$PR_NUMBER is $state without being merged, so there is no branch left to carry the generated locks" >> "$GITHUB_OUTPUT"
          elif [ "$base_ref" != "main" ]; then
            echo "target=abort" >> "$GITHUB_OUTPUT"
            echo "reason=pull request #$PR_NUMBER no longer targets main (base is $base_ref)" >> "$GITHUB_OUTPUT"
          elif [ "$live_head" != "$PR_HEAD_SHA" ]; then
            echo "target=abort" >> "$GITHUB_OUTPUT"
            echo "reason=pull request #$PR_NUMBER head advanced from $PR_HEAD_SHA to $live_head while the locks were generated" >> "$GITHUB_OUTPUT"
          else
            echo "target=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Report an unrepairable generated lock target
        if: steps.target.outputs.target == 'abort'
        env:
          # Reached through the environment, not spliced into the script:
          # `${{ }}` expansion is textual, so a reason carrying shell
          # metacharacters would otherwise be executed as code.
          TARGET_REASON: ${{ steps.target.outputs.reason }}
        run: |
          # Loud on purpose: a silent exit is what let the 0.20.35 locks reach
          # main unsynced.
          echo "::error::$TARGET_REASON"
          exit 1

      - name: Checkout the merge target branch
        if: steps.target.outputs.target == 'main'
        uses: actions/checkout@v6
        with:
          # `pull_request_target` resolves the default checkout to the base
          # branch, which is where the generated locks now have to land.
          ref: ${{ github.event.pull_request.base.ref }}
          path: main-checkout
          persist-credentials: false

      - name: Repair main after the merge race
        if: steps.target.outputs.target == 'main'
        # Resolved from the `main` checkout rather than the workspace root:
        # this run only ever checks out sibling directories, so `./.github/...`
        # at the root does not exist. Taking the action from `main` also keeps
        # the repair definition on trusted code instead of pull request content.
        uses: ./main-checkout/.github/actions/generated-lock-repair
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          workdir: main-checkout

      - name: Revalidate pull request identity and generated diff
        if: steps.target.outputs.target == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        working-directory: pull-request
        run: |
          set -euo pipefail
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - preflight
          git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | python -I - verify-diff

      - name: Commit and push changes
        id: commit
        if: steps.target.outputs.target == 'pr'
        working-directory: pull-request
        run: |
          if git diff --quiet -- Cargo.lock uv.lock crates/workspace-hack/Cargo.toml; then
            echo "Generated lock metadata is already in sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "loonghao"
          git config user.email "hal.long@outlook.com"
          git add Cargo.lock uv.lock crates/workspace-hack/Cargo.toml
          git commit --no-verify -m "chore(ci): sync generated lock metadata"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push fixed generated lock commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ env.PR_HEAD_SHA || github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA || github.event.pull_request.head.sha }}
        working-directory: pull-request
        run: |
          set -euo pipefail
          # Re-capture remote identity without passing the write token to the
          # validation child processes, then enforce the immutable lease.
          env -u PUSH_TOKEN git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | env -u PUSH_TOKEN python -I - validate-remote
          env -u PUSH_TOKEN git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | env -u PUSH_TOKEN python -I - remote-preflight
          env -u PUSH_TOKEN git -C ../trusted-lock-validator show "$TRUSTED_VALIDATOR_REF:scripts/ci/generated_lock_sync.py" | env -u PUSH_TOKEN python -I - verify-commit
          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT
          chmod 600 "$credential_file"
          printf 'https://x-access-token:%s@github.com\n' '${{ secrets.PERSONAL_ACCESS_TOKEN }}' > "$credential_file"
          # Reset repository-local helpers before installing the ephemeral
          # trusted store helper.  This prevents PR-controlled
          # credential.helper=!… entries from executing during push.
          env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY \
            -u ALL_PROXY -u all_proxy \
            git -c http.proxy= \
            -c https.proxy= \
            -c core.gitProxy= \
            -c credential.helper= \
            -c credential.helper="store --file=${credential_file}" \
            push --no-verify --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD_SHA}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

  # Split out from `sync-cargo-metadata` so the comment can be posted with a
  # token scoped to `pull-requests: write` alone. GitHub grants permissions at
  # workflow level and job level, never per step, so leaving this step inside
  # that job would have handed `pull-requests: write` to every step that checks
  # out and builds pull request content. This job checks out nothing and runs
  # nothing from the pull request.
  announce-repair:
    name: Announce generated lock repair
    needs: sync-cargo-metadata
    if: needs.sync-cargo-metadata.outputs.target == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # `continue-on-error` carries over from the original step: a comment that
      # could not be posted deserves a visible failure, not a red workflow,
      # because the repair itself has already opened its own pull request.
      - name: Comment on the merged pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The generated locks could not be pushed here, so leave the reason
          # where a human will look for it instead of only in a run log.
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<BODY
          The generated lock metadata for this pull request was finished after the
          merge, so it could not be pushed to the branch. The same locks were
          regenerated on \`main\` and opened as a repair pull request from
          \`bot/generated-lock-repair\` instead.

          See run $RUN_URL.
          BODY
