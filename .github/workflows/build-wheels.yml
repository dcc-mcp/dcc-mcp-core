name: Build Wheels

on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "Git ref to build, for example v0.15.4"
        required: false
        type: string
        default: ""
      release-tag-name:
        description: "Release tag to upload wheels to GitHub Release (e.g. v0.18.11). Empty means skip upload."
        required: false
        type: string
        default: ""
      reuse-release-assets:
        description: "Reuse immutable dcc-mcp-core distributions from an existing GitHub Release"
        required: false
        type: boolean
        default: false
      overwrite-release-assets:
        description: "Replace same-named assets already attached to the GitHub Release instead of skipping them. Set only for an explicit asset backfill; a normal release must never overwrite."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      checkout-ref:
        required: false
        type: string
        default: ""
      release-tag-name:
        description: "Release tag to upload wheels to GitHub Release (e.g. v0.18.11). Empty means skip upload."
        required: false
        type: string
        default: ""
      reuse-release-assets:
        description: "Reuse immutable dcc-mcp-core distributions from an existing GitHub Release"
        required: false
        type: boolean
        default: false
      overwrite-release-assets:
        description: "Replace same-named assets already attached to the GitHub Release instead of skipping them. Set only for an explicit asset backfill; a normal release must never overwrite."
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_TOKEN:
        description: "Token used to upload wheels to the GitHub Release. Falls back to GITHUB_TOKEN when unset."
        required: false

concurrency:
  # Scope by the resolved checkout target so a release-driven build for tag
  # vX.Y.Z is never grouped with (and never cancelled by) another run for a
  # different ref. Falls back to github.ref when no checkout-ref is provided.
  group: build-wheels-${{ inputs.checkout-ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify-release-assets:
    if: inputs.reuse-release-assets == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - name: Checkout immutable distribution verification tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false

      - name: Read dcc-mcp-core GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag-name }}
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::release-tag-name is required when reuse-release-assets is true"
            exit 1
          fi
          if [ "$CHECKOUT_REF" != "$RELEASE_TAG" ]; then
            echo "::error::checkout-ref must exactly match release-tag-name for an immutable backfill"
            exit 1
          fi
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > release-assets.json

      - name: Classify immutable Core distribution state
        id: classify
        env:
          RELEASE_VERSION: ${{ inputs.release-tag-name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          python .workflow-tools/scripts/ci/check_release_distribution_set.py \
            --assets-json release-assets.json \
            --version "$RELEASE_VERSION" \
            --classify-assets \
            --github-output "$GITHUB_OUTPUT"

  # ── ABI3 builds (Python 3.8+) — one wheel works for all 3.8+ ──

  linux:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: ./.github/actions/build-wheel
        with:
          target: x86_64
          python-version: '3.11'
          # Verification tooling follows the workflow; package source stays on the tag.
          test-wheel: 'false'
          artifact-name: wheels-linux-x86_64
      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
            tests/test_imports.py
          persist-credentials: false
      - name: Test wheel with workflow import smoke
        shell: bash
        run: |
          python -m venv test-env
          if [ "$RUNNER_OS" = "Windows" ]; then
            source test-env/Scripts/activate
          else
            source test-env/bin/activate
          fi
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python .workflow-tools/tests/test_imports.py
      - name: Check wheel contract from workflow ref
        shell: bash
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile abi3
          --platform linux-x86_64
          dist/*.whl
  windows:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: ./.github/actions/build-wheel
        with:
          target: x64
          python-version: '3.11'
          # Verification tooling follows the workflow; package source stays on the tag.
          test-wheel: 'false'
          # --find-interpreter can pick up a non-abi3 Python on Windows,
          # silently downgrading the wheel tag from cp38-abi3 to cp37.
          # Build without it so the abi3-py38 feature in WHEEL_FEATURES
          # (justfile) produces the correct tag.
          maturin-extra-args: ''
          artifact-name: wheels-windows-x64
      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
            tests/test_imports.py
          persist-credentials: false
      - name: Test wheel with workflow import smoke
        shell: bash
        run: |
          python -m venv test-env
          if [ "$RUNNER_OS" = "Windows" ]; then
            source test-env/Scripts/activate
          else
            source test-env/bin/activate
          fi
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python .workflow-tools/tests/test_imports.py
      - name: Check wheel contract from workflow ref
        shell: bash
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile abi3
          --platform windows-x86_64
          dist/*.whl
  # ── py37-lite: pure-Python wheel (py3-none-any) for Python 3.7 ──
  # Maya 2022 / Blender 2.83 embed Python 3.7 and cannot load cp38-abi3
  # wheels. scripts/build_py37_pure_wheel.py assembles a py3-none-any wheel
  # from python/dcc_mcp_core without maturin, Rust, or just (just>=1.0 is
  # unavailable on Python 3.7 and previously blocked release PyPI publish).
  py37-lite:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.7"
      - name: Build py37-lite pure-Python wheel
        run: |
          python -m pip install --upgrade pip wheel
          python scripts/build_py37_pure_wheel.py
        shell: bash
      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false
      - name: Check py37-lite wheel contract
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile lite_py37
          --platform any
          dist/*.whl
        shell: bash
      - name: Test py37-lite wheel
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref || github.ref }}
        shell: bash
        run: |
          python .workflow-tools/scripts/ci/python37_wheel_smoke.py \
            --wheel 'dist/*.whl' --profile lite_py37 --checkout-ref "$CHECKOUT_REF"
      - name: Upload py37-lite wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-py37-lite
          path: dist/
          retention-days: 30
  # ── Native Python 3.7 builds (non-abi3, compiled _core extension) ──
  # These produce cp37-cp37m wheels with a compiled _core extension
  # for Maya 2022 / Blender 2.83 embedded Python 3.7 hosts.
  # Uses WHEEL_FEATURES_PY37 (no abi3-py38) via build-wheel action py37 branch.

  linux-py37:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: ./.github/actions/build-wheel
        with:
          target: x86_64
          python-version: '3.7'
          maturin-extra-args: '-i python3.7'
          artifact-name: wheels-linux-x86_64-py37
          # Keep tagged package source immutable; venv verification belongs to
          # this workflow so backfills do not rerun a tag's broken test step.
          test-wheel: 'false'
      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false
      - name: Check native Python 3.7 wheel contract
        shell: bash
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile native_py37
          --platform linux-x86_64
          dist/*.whl
      - name: Test native Python 3.7 wheel with workflow smoke
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref || github.ref }}
        shell: bash
        run: |
          python -m venv test-env
          test-env/bin/python -c "import sys; assert sys.version_info[:2] == (3, 7), sys.version; assert sys.prefix != sys.base_prefix"
          test-env/bin/python -m pip --version
          test-env/bin/python .workflow-tools/scripts/ci/python37_wheel_smoke.py \
            --wheel 'dist/*.whl' --profile native_py37 --checkout-ref "$CHECKOUT_REF"
          # The isolated smoke deliberately installs without dependencies.
          # Resolve this wheel's declared dependencies before checking them.
          test-env/bin/python -m pip install --force-reinstall dist/*.whl
          test-env/bin/python -m pip check
  windows-py37:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: ./.github/actions/build-wheel
        with:
          target: x64
          python-version: '3.7'
          maturin-extra-args: '-i python3.7'
          artifact-name: wheels-windows-x64-py37
          # A release tag can retain the renamed-interpreter venv regression.
          # Use the workflow-owned clean-venv smoke below instead.
          test-wheel: 'false'
      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false
      - name: Check native Python 3.7 wheel contract
        shell: bash
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile native_py37
          --platform windows-x86_64
          dist/*.whl
      - name: Test native Python 3.7 wheel with workflow smoke
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref || github.ref }}
        shell: bash
        run: |
          # CPython 3.7 venv must use the original python.exe name on Windows.
          python -m venv test-env
          test-env/Scripts/python.exe -c "import sys; assert sys.version_info[:2] == (3, 7), sys.version; assert sys.prefix != sys.base_prefix"
          test-env/Scripts/python.exe -m pip --version
          test-env/Scripts/python.exe .workflow-tools/scripts/ci/python37_wheel_smoke.py \
            --wheel 'dist/*.whl' --profile native_py37 --checkout-ref "$CHECKOUT_REF"
          # Keep the zero-backport smoke ahead of normal dependency resolution.
          test-env/Scripts/python.exe -m pip install --force-reinstall dist/*.whl
          test-env/Scripts/python.exe -m pip check
  macos-py37:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    # This lane is a build-verification spike, not a release contract: the
    # publish-release allowlist below deliberately omits the
    # spike-wheels-macos-x86_64-py37 artifact this lane uploads, and that
    # artifact is named outside the `wheels-*` namespace so the publication
    # globs in release.yml cannot sweep it in either. A red spike here
    # therefore says nothing about the artefacts a release ships.
    #
    # build-wheels is nonetheless one called workflow, and its result gates
    # publish-github-release-assets, so letting this lane fail the caller
    # strands an otherwise-complete release. v0.20.44 is the proof: every
    # contracted lane passed, yet no core wheel was uploaded and
    # dcc-mcp-core stayed on PyPI 0.20.43 while the other three packages
    # moved to 0.20.44. Keep the spike running and visible; stop it from
    # blocking the distributions that are the release.
    continue-on-error: true
    # CPython 3.7 never shipped an ARM64 macOS build, so the ARM64 runner
    # installs the x86_64 python.org package and lets Rosetta 2 run it. The
    # Rust extension is cross-compiled to x86_64-apple-darwin, which is also
    # the slice Maya 2022 on macOS consumes (Apple Silicon via Rosetta 2).
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Add x86_64-apple-darwin Rust target
        shell: bash
        run: rustup target add x86_64-apple-darwin

      # rustc 1.95.0 refuses any deployment target below 10.12 ("the minimum
      # supported by rustc is 10.12"), so the wheel is tagged 10_12 even when
      # MACOSX_DEPLOYMENT_TARGET asks for lower.
      #
      # Note that this does NOT make the wheel uninstallable on Python 3.7.9.
      # pip's macOS tag check reads the version of the RUNNING OS
      # (packaging.tags.mac_platforms -> platform.mac_ver()), not the
      # interpreter's MACOSX_DEPLOYMENT_TARGET. python.org 3.7.9 reports a 10.9
      # deployment target, but installed on macOS 10.12 or newer it happily
      # accepts a macosx_10_12_x86_64 wheel; only a literal macOS 10.9-10.11
      # host would reject it. This job verifies that by installing the wheel it
      # just built. Kept explicit so the constraint is visible in the log rather
      # than silently inherited from the runner image.
      - name: Record the macOS deployment-target floor
        shell: bash
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.12" >> "$GITHUB_ENV"
          rustc --print deployment-target 2>/dev/null || true

      - uses: ./.github/actions/build-wheel
        with:
          target: x86_64-apple-darwin
          python-version: '3.7'
          # Like the Windows py37 job, the interpreter comes from the reusable
          # action: it installs the x86_64 python.org build under Rosetta 2
          # because actions/setup-python has no arm64 CPython 3.7.
          maturin-extra-args: '-i python3.7'
          # Deliberately outside the `wheels-*` namespace: `release.yml` globs
          # `pattern: wheels-*` to collect what a release publishes, so a spike
          # named `wheels-*` would be swept into the distribution set and trip
          # the release distribution contract. The `spike-` prefix keeps this
          # lane's build verification out of every publication path.
          artifact-name: spike-wheels-macos-x86_64-py37

      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false
      - name: Check native Python 3.7 wheel contract
        shell: bash
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile native_py37
          --platform macos-x86_64
          dist/*.whl
      - name: Test native Python 3.7 wheel with workflow smoke
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref || github.ref }}
        shell: bash
        run: |
          # The smoke installs through sys.executable, so select native 3.7
          # explicitly instead of the runner's default Python. Keep the
          # `pip<24.1` ceiling used by the py37 setup actions.
          python3.7 -m pip install --upgrade "pip<24.1" wheel
          python3.7 -m pip --version
          python3.7 .workflow-tools/scripts/ci/python37_wheel_smoke.py \
            --wheel 'dist/*.whl' --profile native_py37 --checkout-ref "$CHECKOUT_REF"
  macos:
    needs: [classify-release-assets]
    if: >-
      always() && (inputs.reuse-release-assets != true ||
      needs.classify-release-assets.outputs.mode == 'rebuild')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - uses: ./.github/actions/build-wheel
        with:
          target: universal2-apple-darwin
          python-version: '3.11'
          # Verification tooling follows the workflow; package source stays on the tag.
          test-wheel: 'false'
          maturin-extra-args: '--sdist --find-interpreter'
          artifact-name: wheels-macos-universal2
      - name: Checkout workflow compatibility tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
            tests/test_imports.py
          persist-credentials: false
      - name: Test wheel with workflow import smoke
        shell: bash
        run: |
          python -m venv test-env
          if [ "$RUNNER_OS" = "Windows" ]; then
            source test-env/Scripts/activate
          else
            source test-env/bin/activate
          fi
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          python .workflow-tools/tests/test_imports.py
      - name: Check wheel contract from workflow ref
        shell: bash
        run: >-
          python .workflow-tools/scripts/ci/check_python_wheel.py
          --profile abi3
          --platform macos-universal2
          dist/*.whl

  # Manual release backfills reuse the immutable bytes already archived on
  # GitHub. When the first release attempt failed before uploading any Core
  # distribution, the classifier instead rebuilds the complete set from the
  # immutable checkout-ref. Partial archived sets fail closed rather than mix
  # archived and rebuilt bytes for one version.
  reuse-release-assets:
    needs: [classify-release-assets]
    if: needs.classify-release-assets.outputs.mode == 'reuse'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable distribution verification tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false

      - name: Download dcc-mcp-core distributions from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag-name }}
          RELEASE_VERSION: ${{ inputs.release-tag-name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if [ -z "$RELEASE_TAG" ] || [ -z "$RELEASE_VERSION" ]; then
            echo "::error::release-tag-name is required when reuse-release-assets is true"
            exit 1
          fi
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern "dcc_mcp_core-${RELEASE_VERSION}-*" \
            --pattern "dcc_mcp_core-${RELEASE_VERSION}.tar.gz"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets > release-assets.json

      - name: Verify downloaded distributions against GitHub digests
        env:
          RELEASE_VERSION: ${{ inputs.release-tag-name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          python .workflow-tools/scripts/ci/check_release_distribution_set.py \
            --assets-json release-assets.json \
            --dist-dir dist \
            --version "$RELEASE_VERSION"

      - name: Upload verified release distributions for PyPI backfill
        uses: actions/upload-artifact@v7
        with:
          name: wheels-release-backfill
          path: dist/
          retention-days: 30

  publish-release:
    needs:
      - linux
      - windows
      - py37-lite
      - linux-py37
      - windows-py37
      - macos
    if: inputs.release-tag-name != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Explicit allowlist rather than `wheels-*`: the `macos-py37` lane
          # uploads `spike-wheels-macos-x86_64-py37` as a build-verification
          # spike, and it deliberately sits outside the `wheels-*` namespace so
          # a glob cannot pull it into the published distribution set even
          # though it is not a release contract. Keep this list in sync with
          # `_EXPECTED_WHEEL_CONTRACTS` in
          # scripts/ci/check_release_distribution_set.py.
          name: wheels-linux-x86_64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-x64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-py37-lite
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64-py37
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-x64-py37
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: wheels-macos-universal2
          path: dist
          merge-multiple: true
      - name: Checkout immutable distribution verification tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: |
            compatibility
            scripts/ci
          persist-credentials: false
      - name: Validate complete Core distribution set before publication
        env:
          RELEASE_VERSION: ${{ inputs.release-tag-name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          python .workflow-tools/scripts/ci/check_release_distribution_set.py \
            --dist-dir dist \
            --version "$RELEASE_VERSION"
      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The default GITHUB_TOKEN is rejected with
          # "Resource not accessible by integration" on the release-update call
          # that precedes every asset upload, which silently drops
          # the whole asset set. release.yml passes the same token
          # release-please uses to cut and publish the release.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ inputs.release-tag-name }}
          files: dist/*
          overwrite_files: ${{ inputs.overwrite-release-assets }}
          fail_on_unmatched_files: true
