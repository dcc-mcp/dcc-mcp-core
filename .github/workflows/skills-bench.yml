name: Skills Benchmark

# The skills benchmark is two different things and they are treated differently.
#
#   hit rate / context growth — deterministic, so they are PR merge gates.
#   latency                   — hardware-dependent, so it is a scheduled trend
#                               signal and never blocks a merge.
#
# See crates/dcc-mcp-skills-bench/src/thresholds.rs for why.

on:
  pull_request:
    paths:
      # Anything that can move ranking quality or discovery cost.
      - "crates/dcc-mcp-gateway-search/**"
      - "crates/dcc-mcp-skills/src/catalog/**"
      - "crates/dcc-mcp-skills-bench/**"
      - "benchmarks/skills/**"
      - "skills/**"
      # SkillMetadata field changes alter what the index actually contains.
      - "crates/dcc-mcp-models/**"
      # Root manifests: a dependency bump (notably `rand`) can change the seeded
      # corpus without touching a line of benchmark code.
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/skills-bench.yml"
  push:
    branches:
      - main
  schedule:
    # Weekly trend series for the efficiency dimension.
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hit-rate-gate:
    name: Hit rate gate (300 skills)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: skills-bench

      # The 300-skill corpus, `dcc`-filtered, against the thresholds in
      # crates/dcc-mcp-skills-bench/src/thresholds.rs. Also asserts the two
      # structural properties the split depends on.
      #
      # `--locked` throughout: Cargo.lock is committed, and without it a
      # manifest/lock mismatch would let cargo silently re-resolve and run the
      # gate against a different dependency set than the one that was reviewed.
      - name: Run the hit-rate regression gate
        run: |
          cargo test --locked --release -p dcc-mcp-skills-bench \
            --test hit_rate_gate -- --include-ignored --test-threads 2
        shell: bash

      - name: Run the multi-DCC context gate
        run: |
          cargo test --locked --release -p dcc-mcp-skills-bench --test context_gate
        shell: bash

      # The library unit tests hold the corpus invariants (hard-negative shapes,
      # workspace-relative seed paths, the pinned corpus digest). They are cheap
      # enough to run here and keep the ignored staleness check company.
      - name: Run the corpus invariant tests
        run: |
          cargo test --locked --release -p dcc-mcp-skills-bench --lib \
            -- --include-ignored
        shell: bash

      # `committed_snapshot_matches_a_live_harvest` is #[ignore]d because it
      # fails on any PR touching a SKILL.md, benchmark-related or not. Here it
      # belongs: this is the workflow that owns the dataset.
      - name: Check the committed seed snapshot is current
        run: |
          set -euo pipefail
          if ! cargo test --locked --release -p dcc-mcp-skills-bench --lib -- --ignored --exact \\
              seeds::tests::committed_snapshot_matches_a_live_harvest; then
            echo "::error::benchmarks/skills/seeds.json is stale." \
                 "Regenerate it with: cargo run -p dcc-mcp-skills-bench --bin skills-bench -- regenerate-seeds"
            exit 1
          fi
        shell: bash

      - name: Emit the benchmark report
        run: |
          cargo run --locked --release -q -p dcc-mcp-skills-bench --bin skills-bench -- \
            report --output skills-bench.json
        shell: bash

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-bench-report
          path: skills-bench.json
          if-no-files-found: ignore

  latency-trend:
    name: Query efficiency trend (not a gate)
    # Latency moves with the machine, not with the code, so it only runs
    # where a change over time is meaningful: main and the weekly schedule.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Restore the trend series from the previous run of this workflow.
      actions: read
      # Open a tracking issue when latency regresses against its baseline.
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: skills-bench

      # Compile-and-smoke the bench so this path is actually exercised. The
      # latency numbers stay ungated, but a bench that never runs is a bench
      # that silently rots: a previous revision measured the wrong DCC shard
      # for every query and no CI job could have caught it.
      - name: Run the criterion query benchmarks
        run: |
          cargo bench --locked -p dcc-mcp-skills-bench --bench skills_bench -- \
            --sample-size 30 --measurement-time 5
        shell: bash
        env:
          CRITERION_CI: "1"

      - name: Upload the criterion HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-bench-criterion-report
          path: target/criterion/
          if-no-files-found: ignore

      # --- Trend series and latency regression alerts (PIP-3703) ---
      #
      # The series is carried between runs as a workflow artifact rather than
      # committed to the repository. A weekly `chore:` commit bumping a data
      # file would be seen as code activity by release-please and start the
      # self-amplifying release loop, so the file is gitignored and lives here.
      #
      # Alerts here never fail the job. They open an issue; that is the whole
      # contract. Making this a merge gate is exactly what thresholds.rs
      # refuses to do.

      - name: Restore the trend history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p benchmarks/skills
          # Every step here is best-effort: the trend series is derived data,
          # so failing to restore it costs warm-up time, not correctness.
          previous=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/skills-bench.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id' || echo "")
          if [ -n "$previous" ] && [ "$previous" != "null" ]; then
            gh run download "$previous" \
              -n skills-bench-trend-history \
              -D benchmarks/skills \
              || echo "run $previous has no trend history; starting a new series"
          else
            echo "no previous successful run; starting a new trend series"
          fi
          if [ -f benchmarks/skills/trend-history.json ]; then
            restored=$(jq '.points | length' benchmarks/skills/trend-history.json 2>/dev/null || echo "?")
            echo "restored $restored trend points"
          fi
        shell: bash

      # Records one point across all three dimensions, compares latency p95
      # against the rolling median of the last four runs on the same corpus,
      # and writes the alerts as data. Prints the human-readable trend to the
      # job log as well as to the file.
      - name: Record the three-dimension trend point
        run: |
          cargo run --locked --release -q -p dcc-mcp-skills-bench --bin skills-bench -- \
            report \
            --output skills-bench-trend.json \
            --trend-history benchmarks/skills/trend-history.json \
            --trend-report skills-bench-trend.md \
            --trend-alerts skills-bench-alerts.json
        shell: bash

      # The one place to read all three dimensions together, so a periodic
      # review does not mean opening three different workflow runs.
      - name: Publish the trend to the job summary
        run: cat skills-bench-trend.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Upload the trend series
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-bench-trend-history
          path: benchmarks/skills/trend-history.json
          if-no-files-found: ignore

      - name: Upload the trend report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-bench-trend-report
          path: |
            skills-bench-trend.md
            skills-bench-trend.json
            skills-bench-alerts.json
          if-no-files-found: ignore

      - name: Open an issue when latency regresses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No alerts file means the step above did not get far enough to
          # measure anything. That is not a regression, so it is not reported.
          [ -f skills-bench-alerts.json ] || {
            echo "no alerts file was produced"
            exit 0
          }
          count=$(jq '.alerts | length' skills-bench-alerts.json)
          if [ "$count" -eq 0 ]; then
            echo "no latency regression against the rolling baseline"
            exit 0
          fi

          label="skills-bench-latency-regression"
          gh label create "$label" --color d93f0b \
            --description "Skills benchmark query latency regressed against its rolling baseline" \
            2>/dev/null || true

          {
            echo "The skills benchmark measured query latency p95 more than 50% above the"
            echo "rolling median of the previous four runs **on the same corpus**."
            echo
            echo "This is **not** a merge gate. Latency is deliberately not gated because CI"
            echo "hardware alone can move it by a factor of two; see"
            echo "\`crates/dcc-mcp-skills-bench/src/thresholds.rs\`. The job that raised this"
            echo "passed. The point of the issue is that a human is now told."
            echo
            echo '```json'
            cat skills-bench-alerts.json
            echo '```'
            echo
            echo "Trend report and full series: [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > alert-body.md

          # One open issue at a time: a weekly cron that opens a new issue
          # every week is noise, and noise is how alerts get ignored.
          existing=$(gh issue list --label "$label" --state open --limit 1 \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file alert-body.md
            echo "appended to the open regression issue #$existing"
          else
            gh issue create \
              --title "Skills benchmark: query latency regressed against its rolling baseline" \
              --label "$label" \
              --body-file alert-body.md
          fi
        shell: bash
