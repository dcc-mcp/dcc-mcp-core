name: Refresh published lock pins

# Why this workflow exists
# ------------------------
# `uv.lock` pins `dcc-mcp-core-semantic` and `dcc-mcp-server` as ordinary PyPI
# registry packages: `pkg/*` is not part of the uv workspace and the root
# `pyproject.toml` declares no `[tool.uv.sources]`, so the two pins only move
# when something explicitly asks uv to re-resolve them. Nothing did, and the
# pins silently sat on 0.20.12 across twelve releases.
#
# `scripts/ci/check_lock_versions.py` now detects that drift, but detection
# alone leaves every release PR to trip its own gate once and a human to run
# `uv lock --upgrade-package ...` by hand. This workflow closes the loop: it
# moves the two pins to the newest published release on a schedule, so the lock
# on `main` normally already tracks the latest published version.
#
# Safety properties
# -----------------
# * Idempotent — an up-to-date lock produces no diff, no commit and no PR.
# * Scoped — `scripts/ci/uv_lock_refresh.py` fails the run when anything but
#   the two allowed packages moves, when a cp37 wheel disappears, or when
#   `requires-python` is narrowed. A surprising re-resolution is reported,
#   never merged.
# * Honest — `scripts/ci/uv_lock_refresh.py classify` reports whether the run
#   moved package versions or only re-emitted marker text, and the commit
#   message, pull-request title and pull-request body all follow that verdict.
#   A marker-only relock must not announce a version refresh.
# * Non-releasing — the commit type is `chore(lock)`, which release-please
#   hides from the changelog and never turns into a version bump, so the
#   release-please self-increment loop cannot restart through this path.
# * Unrelated to the release trust boundary — this workflow never runs from
#   `pull_request_target` and never executes the pinned validator ref used by
#   `release-please-lock-sync.yml`.
# * Signed as the repository owner — the refresh branch is pushed with the
#   repository automation token, not with the short-lived workflow token, so
#   the pull request triggers the normal CI gates instead of being skipped as
#   a `GITHUB_TOKEN`-authored PR.
# * No auto-merge — `main` enables auto-merge but requires no status checks
#   and no review, so auto-merge would land on the first status event instead
#   of waiting for the lanes that exercise the published wheels. The refresh
#   PR stops at "open" and merging stays a human gate.
# * Loud on failure — `scripts/ci/uv_lock_refresh.py` fails closed, which
#   silently restores the very drift this workflow removes, so a failed run
#   files an issue under the `uv-lock-refresh` label instead of only leaving
#   a failed run behind.
#
# Release PR coupling
# -------------------
# A refresh PR against `main` is not the commit that merges next: the release
# PR is, and it carries whatever the lock held when release-please last rebuilt
# it -- one publish behind, because release-please raises every declared
# version and writes its changelog heading in a single commit while the pins
# can only follow the index. Merging it exported that stale lock to `main`
# every release, and `main` stayed red until somebody merged the refresh PR.
#
# The `workflow_run` trigger below closes that gap: as soon as a release run
# finishes publishing, this workflow moves the pins on the pending release PR
# too, so the version bump and the pin refresh reach `main` as one change.

on:
  schedule:
    # Daily at 03:47 UTC: off the hour, and well after the 18:07 CST
    # (10:07 UTC) release dispatch, so the version published the previous
    # evening is already on PyPI when this runs. The reliable follow-up to a
    # release is the `workflow_run` trigger below, not this cron.
    - cron: "47 3 * * *"
  workflow_dispatch:
  workflow_run:
    # Publish-driven instead of clock-driven: the release window's start time
    # drifts with GitHub's scheduling delay, so a cron cannot be placed
    # reliably after the wheels land. This fires on every completed release run
    # and the job itself filters for success.
    workflows: ["Release"]
    types: [completed]

# Read-only on purpose. Every write in this workflow goes through the
# repository automation token (`secrets.PERSONAL_ACCESS_TOKEN`): the branch
# push uses a credential-store file after `-c credential.helper=` clears the
# inherited helper, and `gh pr` / `gh issue` run with `GH_TOKEN` set to the
# same token. The workflow token never writes anything, so it keeps read-only
# scope.
permissions:
  contents: read

concurrency:
  group: uv-lock-refresh
  cancel-in-progress: false

env:
  REFRESH_BRANCH: bot/uv-lock-refresh
  # One title per classified outcome. `uv lock` rewrites the whole file, so a
  # run can re-emit every dependency marker while moving no package version at
  # all -- usually because the two pins already sat on the newest release.
  # Calling that a version refresh misdescribes the change in the commit
  # history, so the title follows `uv_lock_refresh.py classify`.
  #
  # `unchanged` gets its own title for the same reason: the classifier
  # fingerprints a deliberate subset of `uv.lock`, so bytes can move without
  # it seeing a change. Announcing a version refresh for that would be the
  # exact misdescription this block exists to prevent.
  TITLE_VERSIONS: "chore(lock): refresh published dcc-mcp-server and dcc-mcp-core-semantic pins"
  TITLE_MARKER_ONLY: "chore(lock): re-emit uv.lock markers without changing package versions"
  TITLE_UNCHANGED: "chore(lock): rebuild uv.lock without a classifiable content change"
  # Pinned on purpose: `uv lock` output follows the resolver version (lock
  # revision, entry ordering, how much of the graph it re-resolves), so an
  # unattended refresh is only reproducible against a fixed resolver. Bump
  # this in a reviewed change rather than letting a floating `latest` move
  # underneath the guard.
  UV_VERSION: "0.11.16"
  NOTIFY_LABEL: uv-lock-refresh

jobs:
  refresh:
    name: Refresh published PyPI pins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A failed or cancelled release run publishes nothing, so there is no new
    # version for the pins to track.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: loonghao/vx@v0.9.34
        with:
          version: "0.9.34"
          cache-key-prefix: "vx-tools-v0.9.34"

      - name: Re-resolve the two published pins
        run: |
          set -euo pipefail
          cp uv.lock /tmp/uv.lock.before
          vx uvx --from "uv==$UV_VERSION" uv lock --upgrade-package dcc-mcp-core-semantic --upgrade-package dcc-mcp-server
          cp uv.lock /tmp/uv.lock.after

      - name: Verify the refresh stayed scoped
        run: python scripts/ci/uv_lock_refresh.py verify /tmp/uv.lock.before /tmp/uv.lock.after

      - name: Verify the committed lock gates still pass
        run: |
          set -euo pipefail
          python scripts/ci/check_uv_lock.py
          python scripts/ci/check_lock_versions.py
          vx uvx --from "uv==$UV_VERSION" uv lock --check

      - name: Verify only uv.lock moved
        run: |
          set -euo pipefail
          touched="$(git status --porcelain --untracked-files=no | grep -v ' uv\.lock$' || true)"
          if [ -n "$touched" ]; then
            echo "::error::the refresh touched files other than uv.lock:"
            echo "$touched"
            exit 1
          fi

      - name: Detect a lock change
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The two published pins already track the newest release; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- uv.lock
          fi

      - name: Classify the lock change
        id: kind
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # Runs after `verify`, so an out-of-scope refresh has already failed
          # the run: whatever reaches here is either a real version move or a
          # relock that only re-emitted markers. The step writes
          # `change-kind`, `marker-only`, `version-changes`, `marker-changes`,
          # `resolution-markers-changed` and `summary` to $GITHUB_OUTPUT.
          python scripts/ci/uv_lock_refresh.py classify /tmp/uv.lock.before /tmp/uv.lock.after --json

      - name: Open or update the refresh pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Read through env rather than interpolating into the script body:
          # the value is produced by the guard, but keeping it out of the
          # shell text means a surprising value cannot become shell syntax.
          CHANGE_KIND: ${{ steps.kind.outputs.change-kind }}
          CHANGE_SUMMARY: ${{ steps.kind.outputs.summary }}
        run: |
          set -euo pipefail

          # `unchanged` does reach this step. The diff gate above only proves
          # `uv.lock` bytes moved, not that the classifier can see the change:
          # a drift outside its fingerprint (lock `revision`, a field it does
          # not read) is still `unchanged` with a non-empty diff. Give it its
          # own title instead of letting it fall through to the
          # version-refresh wording.
          case "$CHANGE_KIND" in
            marker-only) refresh_title="$TITLE_MARKER_ONLY" ;;
            unchanged) refresh_title="$TITLE_UNCHANGED" ;;
            *) refresh_title="$TITLE_VERSIONS" ;;
          esac
          echo "Refresh classified as $CHANGE_KIND; commit and PR title: $refresh_title"

          git config user.name "loonghao"
          git config user.email "hal.long@outlook.com"
          git switch -C "$REFRESH_BRANCH" HEAD
          git add uv.lock
          git commit --no-verify -m "$refresh_title"

          # The branch is rebuilt from `main` on every run, so the push is a
          # force push; the lease still protects against a concurrent writer.
          lease=()
          remote_sha="$(git ls-remote origin "refs/heads/$REFRESH_BRANCH" | awk 'NR==1 {print $1}')"
          if [ -n "$remote_sha" ]; then
            lease=("--force-with-lease=refs/heads/$REFRESH_BRANCH:${remote_sha}")
          fi

          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT
          chmod 600 "$credential_file"
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$credential_file"
          git -c credential.helper= \
            -c credential.helper="store --file=${credential_file}" \
            push "${lease[@]}" origin "HEAD:refs/heads/$REFRESH_BRANCH"

          body_file="$(mktemp)"

          # The rationale paragraph follows the classification: a relock that
          # moved no version has a different reason to exist than one that did,
          # and one the classifier cannot see at all has a third.
          if [ "$CHANGE_KIND" = "marker-only" ]; then
            cat > "$body_file" <<'BODY_MARKER_ONLY'
          `uv lock` re-emitted this lockfile **without moving a single package
          version**. The two published pins already sat on the newest release, so
          the refresh had nothing to upgrade; what changed is lockfile content
          only -- `dependencies`, `[package.optional-dependencies]`,
          `[package.metadata] requires-dist`, `source`, `sdist`, `wheels`, and/or
          the `resolution-markers` lists, global or per package block.

          This is a resolver-output change, not a dependency change: no package
          is added, removed, upgraded or downgraded, and `requires-python` is
          untouched.
          BODY_MARKER_ONLY
          elif [ "$CHANGE_KIND" = "unchanged" ]; then
            cat > "$body_file" <<'BODY_UNCHANGED'
          `uv lock` rewrote this lockfile, but the guard found **no package
          version, no marker and no distribution artifact that moved**. The
          classifier fingerprints a deliberate subset of `uv.lock` -- versions,
          dependency markers, resolution layering, and each package's `source`,
          `sdist` and `wheels` -- so the diff that produced this pull request is
          outside that subset: lockfile bookkeeping such as the top-level
          `revision`, or a field the fingerprint does not read.

          Nothing here is a dependency change: no package is added, removed,
          upgraded or downgraded, and `requires-python` is untouched. Read the
          diff before merging -- the automated verdict is "nothing I can
          classify", not "nothing happened".
          BODY_UNCHANGED
          else
            cat > "$body_file" <<'BODY_VERSIONS'
          `dcc-mcp-core-semantic` and `dcc-mcp-server` are consumed from PyPI as
          ordinary registry dependencies, so their pins only move when uv is asked
          to re-resolve them explicitly. This refresh moves both pins to the newest
          published release so `scripts/ci/check_lock_versions.py` keeps passing
          without a manual `uv lock --upgrade-package` run.
          BODY_VERSIONS
          fi

          # Prepend the classification and append the invariants. Both are
          # interpolated, so the backticks here are escaped -- the static
          # paragraphs above use a quoted heredoc and keep theirs literal.
          header_file="$(mktemp)"
          cat > "$header_file" <<BODY_HEADER
          Automated \`uv.lock\` maintenance.

          **Classification:** \`${CHANGE_KIND}\` -- ${CHANGE_SUMMARY}

          BODY_HEADER
          cat "$header_file" "$body_file" > "${body_file}.merged"
          mv "${body_file}.merged" "$body_file"
          rm -f "$header_file"

          cat >> "$body_file" <<'BODY_FOOTER'

          - Changed: `uv.lock` only
          - Packages: `dcc-mcp-core-semantic`, `dcc-mcp-server`
          - Guards: `scripts/ci/uv_lock_refresh.py`, `scripts/ci/check_uv_lock.py`,
            `scripts/ci/check_lock_versions.py`, `uv lock --check`
          - Commit type: `chore(lock)`, which release-please hides and never bumps

          The workflow is idempotent: an already-current lock produces no commit and
          no pull request.
          BODY_FOOTER

          existing="$(gh pr list --state open --base main --head "$REFRESH_BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$REFRESH_BRANCH" --title "$refresh_title" --body-file "$body_file"
          else
            echo "Refresh PR #$existing is already open; the push above updated it."
            gh pr edit "$existing" --title "$refresh_title" --body-file "$body_file"
          fi

          # The pull request stops here on purpose. `main` carries no required
          # status checks and no required review, so auto-merge would merge on
          # the first status event instead of waiting for the lanes that
          # actually exercise the published wheels. Merging stays a human gate.

      - name: Move the pins on the pending release pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The pull request above refreshes `main`; this step refreshes the
          # commit that actually merges next. release-please raises every
          # declared version and writes its changelog heading in one commit,
          # so the release PR inherits whatever the lock held when it was last
          # rebuilt -- one publish behind by construction. Pushing the same
          # refresh here makes the version bump and the pin refresh a single
          # change, so merging the release PR cannot hand `main` a lock that is
          # already behind the release it just declared.
          pr_number="$(
            gh pr list --state open --base main --limit 100 \
              --json number,title,headRefName,isCrossRepository,isDraft \
              --jq '[.[] | select((.isCrossRepository | not) and (.isDraft | not) and
                                  (.headRefName | startswith("release-please--branches--main")) and
                                  (.title | startswith("chore(main): release "))) | .number] | .[0] // empty'
          )"
          if [ -z "$pr_number" ]; then
            echo "No pending release-please PR; the refresh pull request alone carries the pins."
            exit 0
          fi

          head_ref="$(gh pr view "$pr_number" --json headRefName --jq .headRefName)"
          echo "Pending release PR #$pr_number on $head_ref; refreshing its pins as well."

          git fetch --no-tags origin "refs/heads/$head_ref"
          git checkout --detach FETCH_HEAD

          cp uv.lock /tmp/uv.lock.release.before
          vx uvx --from "uv==$UV_VERSION" uv lock --upgrade-package dcc-mcp-core-semantic --upgrade-package dcc-mcp-server
          cp uv.lock /tmp/uv.lock.release.after
          python scripts/ci/uv_lock_refresh.py verify /tmp/uv.lock.release.before /tmp/uv.lock.release.after

          if git diff --quiet -- uv.lock; then
            echo "PR #$pr_number already tracks the newest published pins."
            exit 0
          fi

          # The release branch is a different base, so it gets its own verdict
          # rather than inheriting the one taken against `main`.
          release_kind="$(
            python scripts/ci/uv_lock_refresh.py classify \
              /tmp/uv.lock.release.before /tmp/uv.lock.release.after --json |
              jq -r .kind
          )"
          case "$release_kind" in
            marker-only) release_title="$TITLE_MARKER_ONLY" ;;
            *) release_title="$TITLE_VERSIONS" ;;
          esac
          echo "Release-branch refresh classified as $release_kind"

          # The gate on the release PR is the proof the refresh landed: with the
          # pins on the newest published release it passes without the one
          # release of window tolerance. A failure is reported rather than
          # fatal -- the release PR stays inside the tolerance and its own CI
          # reruns the gate on every push.
          python scripts/ci/check_lock_versions.py || \
            echo "::warning::PR #$pr_number still sits inside the release-window tolerance"

          git config user.name "loonghao"
          git config user.email "hal.long@outlook.com"
          git add uv.lock
          git commit --no-verify -m "$release_title"

          # The branch belongs to release-please, which force-pushes it whenever
          # it rebuilds the PR, so the lease is taken against the live remote
          # head instead of the fetched one.
          lease=()
          remote_sha="$(git ls-remote origin "refs/heads/$head_ref" | awk 'NR==1 {print $1}')"
          if [ -n "$remote_sha" ]; then
            lease=("--force-with-lease=refs/heads/${head_ref}:${remote_sha}")
          fi

          credential_file="$(mktemp)"
          trap 'rm -f "$credential_file"' EXIT
          chmod 600 "$credential_file"
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$credential_file"
          git -c credential.helper= \
            -c credential.helper="store --file=${credential_file}" \
            push "${lease[@]}" origin "HEAD:refs/heads/$head_ref"

      - name: Report a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # A failed refresh silently restores exactly the drift this workflow
          # exists to remove, so it has to leave a visible trail instead of a
          # failed run nobody is subscribed to.
          if ! gh label list --limit 200 --json name --jq '.[].name' | grep -qx "$NOTIFY_LABEL"; then
            gh label create "$NOTIFY_LABEL" \
              --description "Scheduled uv.lock pin refresh needs attention" \
              --color EDEDED >/dev/null || true
          fi

          existing="$(gh issue list --state open --label "$NOTIFY_LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Refresh failure is already tracked by issue #$existing; not filing a duplicate."
            exit 0
          fi

          gh issue create \
            --title "uv.lock pin refresh failed on $(date -u +%Y-%m-%d)" \
            --label "$NOTIFY_LABEL" \
            --body-file - <<BODY
          The scheduled \`uv.lock\` pin refresh failed. Until it is fixed the two
          published pins (\`dcc-mcp-core-semantic\`, \`dcc-mcp-server\`) stop
          tracking the newest release, which is the drift this workflow exists to
          prevent.

          - Run: $RUN_URL
          - Resolver: uv $UV_VERSION

          The guard fails closed, so no pull request was opened. Check the run log
          for the failing step: an out-of-scope re-resolution, a dropped \`cp37\`
          wheel, a narrowed \`requires-python\`, or a pin that moved backwards.
          BODY
