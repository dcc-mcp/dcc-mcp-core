name: Adapter coverage

# Keeps the adapter coverage map and the generated README pointer blocks honest.
#
# `dcc-mcp-catalog.yml` is the single source of truth for the host matrix. The
# coverage map and the pointer block in every adapter README are generated from
# it, so a catalog edit that is not followed by a regeneration leaves the
# ecosystem describing a host list that no longer exists. This gate turns that
# into a red check instead of a silently stale document.
#
# The `coverage` job guards the maps this repository commits. The
# `pointer-drift` job is the cross-repository half: it clones every adapter and
# replays the generator against the README each one actually publishes, so
# drift that lands in an adapter repository rather than here is caught too.
#
# Triggers on a PR that touches the catalog, the generator, its tests, the
# generated coverage map, or this workflow; plus a weekly schedule and a manual
# dispatch for the cross-repository scan, which cannot be driven from `paths`
# because the drift happens in other repositories.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - "dcc-mcp-catalog.yml"
      - "docs/adapter-coverage.md"
      - "docs/adapter-coverage.json"
      - "scripts/generate_adapter_pointer.py"
      - "scripts/check_adapter_pointer_drift.py"
      - "tests/test_generate_adapter_pointer.py"
      - "tests/test_check_adapter_pointer_drift.py"
      - ".github/workflows/adapter-coverage.yml"
  schedule:
    # Weekly, Monday 04:17 UTC. Off the top of the hour so the run does not
    # land in the same scheduling slot as every other org workflow.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated adapter names to scan (default: every catalog adapter)."
        required: false
        type: string
      allow_missing:
        description: "Treat a missing README or pointer block as acceptable instead of a failure."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage map and pointer blocks
    runs-on: ubuntu-latest
    # Only meaningful for a PR from this repository; `schedule` and
    # `workflow_dispatch` payloads have no pull_request and are skipped.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PyYAML is installed explicitly because this lane does a bare checkout
      # with no wheel build, so `dcc_mcp_core._core` is absent and the
      # generator cannot fall back to the Rust-backed YAML codec. It is the
      # same dependency every `Test (os, py)` lane installs
      # (test_toolchain.pyyaml_py37 in compatibility/python.json), so this lane
      # exercises the same catalog-read path as the test matrix rather than a
      # parallel one.
      - name: Install pytest and PyYAML
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      # The committed map must be byte-identical to what the catalog generates.
      # `report` is offline, so this stays reproducible and needs no secrets.
      - name: Coverage map is current
        run: python scripts/generate_adapter_pointer.py report --check

      # The host count the narrative quotes comes from the catalog. If it moves
      # without the map being regenerated, the check above already failed; this
      # prints it so the number is visible in the run log.
      - name: Report the adapter count
        run: |
          count="$(python -c "
          import yaml
          entries = yaml.safe_load(open('dcc-mcp-catalog.yml', encoding='utf-8'))['entries']
          print(sum(1 for e in entries if 'adapter' in (e.get('tags') or [])))
          ")"
          echo "catalog adapter entries: $count"
          echo "adapter_count=$count" >> "$GITHUB_STEP_SUMMARY"

      # --noconftest on purpose, like the release-workflow-integrity lane:
      # tests/conftest.py imports the compiled dcc_mcp_core extension at module
      # scope, and this lane deliberately does not wait for a wheel build.
      - name: Pointer generator tests
        run: |-
          python -m pytest tests/test_generate_adapter_pointer.py \
            -q --no-header --noconftest

      - name: Generated copy clears the banned-claim list
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from scripts import generate_adapter_pointer as generator

          catalog = generator.load_catalog(Path("dcc-mcp-catalog.yml"))
          entries = generator.adapter_entries(catalog)
          if not entries:
              print("::error::catalog contains no adapter entries")
              sys.exit(1)

          for entry in entries:
              generator.render_pointer(entry, host_count=len(entries))

          report = generator.render_report(entries)
          missing = [e["name"] for e in entries if f"`{e['name']}`" not in report]
          if missing:
              print(f"::error::coverage map is missing adapters: {missing}")
              sys.exit(1)
          print(f"checked {len(entries)} adapter pointer blocks")
          print(f"coverage map enumerates all {len(entries)} adapters")
          PY

  # The half that was missing. `generate_adapter_pointer.py` could always verify
  # one repository; nothing walked all of them, so a catalog change that only
  # some adapters picked up left the rest quoting an outdated host count with no
  # check anywhere turning red. This job is that walk.
  #
  # It is read-only with respect to the adapter repositories: it clones, replays
  # the generator against each README, and reports. It never opens a pull
  # request, so a red run is a signal for a human (or a follow-up batch job),
  # not an autonomous edit to 40 public repositories.
  #
  # The scan step is `continue-on-error`. The fleet-level drift it reports
  # (28 adapters on an outdated count, 16 with no block at all) can only be
  # cleared by regenerating those repositories, which is deliberately out of
  # scope for any single core PR. Blocking on it here would leave the check
  # permanently red and train everyone to ignore it, so it reports the drift
  # list into the job summary and the artifact and stays non-blocking until the
  # fleet has been regenerated. Flip `continue-on-error` to false once that
  # lands. The scanner's own unit tests above remain strictly blocking.
  pointer-drift:
    name: Adapter README pointer drift
    runs-on: ubuntu-latest
    # A fork PR has no business cloning 47 repositories, and a push to main
    # already ran this on the PR that produced it.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Same reasoning as the `coverage` job: a bare checkout has no built
      # `dcc_mcp_core._core`, so the generator reads the catalog through PyYAML.
      - name: Install pytest and PyYAML
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      # --noconftest: tests/conftest.py imports the compiled extension, and this
      # lane does not build a wheel.
      - name: Drift scanner tests
        run: |-
          python -m pytest tests/test_check_adapter_pointer_drift.py \
            -q --no-header --noconftest

      - name: Scan every adapter README against the catalog
        id: scan
        continue-on-error: true
        env:
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_ALLOW_MISSING: ${{ inputs.allow_missing }}
        run: |
          args=()
          if [ -n "${INPUT_ONLY}" ]; then
            args+=(--only "${INPUT_ONLY}")
          fi
          # The default for a scheduled run allows a missing block: sixteen
          # catalog adapters have never received one, and that backlog is a
          # separate cleanup from the count drift this gate exists to catch.
          # A manual dispatch can tighten it to see the full picture.
          if [ "${INPUT_ALLOW_MISSING}" != "false" ]; then
            args+=(--allow-missing)
          fi
          python scripts/check_adapter_pointer_drift.py \
            --timeout 180 --summary --json-out drift-results.json "${args[@]}"

      - name: Report the drift verdict
        if: always() && steps.scan.outcome != 'skipped'
        run: |
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "::warning::adapter README pointer drift detected; see the job summary and the adapter-pointer-drift artifact."
          else
            echo "Every adapter README matches the current catalog output."
          fi

      - name: Upload drift results
        if: always() && hashFiles('drift-results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: adapter-pointer-drift
          path: drift-results.json
          if-no-files-found: ignore
