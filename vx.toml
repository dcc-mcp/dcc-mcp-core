[tools]
just = "latest"
# artifact class: the maturin version ends up in the built wheel, so it is
# pinned to a minor line instead of floating on `latest`.
maturin = "1.15"
node = "22"
python = "3.12"
rust = "1.95"
uv = "latest"

[scripts]
admin-build = "just admin-build"
build = "just build"
build-release = "cargo build --release"
check = "just check"
ci = "just ci"
clean = "just clean"
clippy = "just clippy"
default = "just default"
dev = "just dev"
doc = "cargo doc"
docs-check = "just docs-check"
fmt = "just fmt"
fmt-check = "just fmt-check"
format = "cargo fmt"
install = "just install"
lint = "just lint"
lint-fix = "just lint-fix"
lint-py = "just lint-py"
lint-py-fix = "just lint-py-fix"
preflight = "just preflight"
test = "just test"
test-cov = "just test-cov"
test-rust = "just test-rust"
typecheck = "uv run mypy ."
