[tools]
just = "latest"
# artifact class: the maturin version ends up in the built wheel, so it is
# pinned to a minor line instead of floating on `latest`.
maturin = "1.15"
node = "22"
python = "3.12"
rust = "1.95"
uv = "latest"

# No [scripts] here on purpose: every entry duplicated a justfile recipe, so
# the two copies drifted silently whenever a recipe was renamed. Run
# `just <recipe>` instead.
#
# Four entries were not verbatim `just xxx` mirrors and are handled explicitly:
#   `typecheck`     (`uv run mypy .`)        -> new `typecheck` recipe
#                   (now `uv run --extra dev mypy .`: mypy is an optional dep)
#   `build-release` (`cargo build --release`) -> new `build-release` recipe
#   `doc`           (`cargo doc`)            -> new `doc` recipe
#   `format`        (`cargo fmt`)            -> covered by `fmt` (`cargo fmt --all`)
