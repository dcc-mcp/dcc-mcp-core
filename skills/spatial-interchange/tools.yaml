tools:
  - name: plan_conversion
    description: "Plan a source-to-target spatial conversion from explicit signed axes and meters per unit."
    source_file: scripts/plan_conversion.py
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      required: [source, target]
      properties:
        source:
          type: object
          additionalProperties: false
          required: [right, up, forward, meters_per_unit]
          properties:
            name:
              type: string
            right:
              type: string
              enum: ["+X", "-X", "+Y", "-Y", "+Z", "-Z"]
            up:
              type: string
              enum: ["+X", "-X", "+Y", "-Y", "+Z", "-Z"]
            forward:
              type: string
              enum: ["+X", "-X", "+Y", "-Y", "+Z", "-Z"]
            meters_per_unit:
              type: number
              exclusiveMinimum: 0
        target:
          type: object
          additionalProperties: false
          required: [right, up, forward, meters_per_unit]
          properties:
            name:
              type: string
            right:
              type: string
              enum: ["+X", "-X", "+Y", "-Y", "+Z", "-Z"]
            up:
              type: string
              enum: ["+X", "-X", "+Y", "-Y", "+Z", "-Z"]
            forward:
              type: string
              enum: ["+X", "-X", "+Y", "-Y", "+Z", "-Z"]
            meters_per_unit:
              type: number
              exclusiveMinimum: 0
        sample_point:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: Optional source-space point to convert as a landmark check.
    output_schema:
      type: object
      additionalProperties: true
      required: [success, message, context]
      properties:
        success:
          type: boolean
        message:
          type: string
        context:
          type: object
          additionalProperties: true
          required:
            - source
            - target
            - axis_matrix
            - position_scale
            - position_matrix
            - determinant
            - orientation_reversing
            - mesh_winding
            - requires_tangent_handedness_flip
            - matrix_convention
          properties:
            source:
              type: object
            target:
              type: object
            axis_matrix:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: array
                minItems: 3
                maxItems: 3
                items:
                  type: number
            position_scale:
              type: number
            position_matrix:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: number
            determinant:
              type: number
            orientation_reversing:
              type: boolean
            mesh_winding:
              type: string
              enum: [preserve, reverse]
            requires_tangent_handedness_flip:
              type: boolean
            matrix_convention:
              type: string
            converted_sample_point:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: number
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    call_examples:
      - arguments:
          source:
            name: Blender model space
            right: "-X"
            up: "+Z"
            forward: "-Y"
            meters_per_unit: 1.0
          target:
            name: glTF 2.0
            right: "-X"
            up: "+Y"
            forward: "+Z"
            meters_per_unit: 1.0
          sample_point: [1, 2, 3]
        note: "Plan Blender model-space axes to glTF and convert one landmark point."
      - arguments:
          source:
            name: Unity
            right: "+X"
            up: "+Y"
            forward: "+Z"
            meters_per_unit: 1.0
          target:
            name: Unreal Engine
            right: "+Y"
            up: "+Z"
            forward: "+X"
            meters_per_unit: 0.01
        note: "Plan Unity-to-Unreal axes and meter-to-centimeter position scaling."
