tools:
  - name: inspect_ui
    description: >-
      Take a full snapshot of the current UI state: list all windows,
      capture widget trees for each window, and optionally take a screenshot.
      Use this to understand what's visible before interacting with UI elements.
    input_schema:
      type: object
      properties:
        window_title:
          type: string
          description: "Filter to windows whose title contains this substring."
        include_widget_tree:
          type: boolean
          description: "Include full widget hierarchy (default true)."
          default: true
        include_screenshot:
          type: boolean
          description: "Capture a screenshot alongside widget data (default true)."
          default: true
        max_depth:
          type: integer
          description: "Maximum widget tree depth (default 10, -1 for unlimited)."
          default: 10
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 20
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    source_file: scripts/inspect_ui.py
    call_examples:
      - arguments:
          window_title: "Maya"
          include_screenshot: true
        note: "Inspect all Maya windows with screenshot"
      - arguments:
          include_widget_tree: true
          max_depth: 5
        note: "Get top-level widget overview across all windows"

  - name: find_widget
    description: >-
      Search the widget tree for elements matching criteria: by text,
      type (class name), accessible role, or control ID. Returns widget
      paths and metadata for inspection. Use ui_control__snapshot/find when a
      semantic control_id will be passed to interact_widget.
    input_schema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: "Search text: widget text, type name, or role (e.g. 'OK', 'QPushButton', 'menu item')."
        widget_type:
          type: string
          description: "Filter by widget class (e.g. 'QPushButton', 'QLineEdit', 'QCheckBox')."
        window_title:
          type: string
          description: "Limit search to windows matching this title."
        limit:
          type: integer
          description: "Maximum results (default 20)."
          default: 20
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 15
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    source_file: scripts/find_widget.py
    call_examples:
      - arguments:
          query: "Save"
          widget_type: "QPushButton"
        note: "Find Save buttons across all windows"
      - arguments:
          query: "File"
          window_title: "Maya"
        note: "Find 'File' menu in Maya windows"

  - name: interact_widget
    description: >-
      Interact once with a semantic UI Control node, verify with a fresh
      snapshot, and always stop the Computer Use session. Requires an exact
      DCC instance, stable session id, and control_id. Raw coordinates must use
      ui_control__act directly with the latest snapshot_id.
    input_schema:
      type: object
      required: [widget, instance, session_id]
      properties:
        instance:
          type: string
          minLength: 1
          description: "Exact DCC instance short ID or UUID; never inferred."
        session_id:
          type: string
          minLength: 1
          description: "Stable UI Control session ID for this one-action loop."
        widget:
          type: object
          required: [control_id]
          description: "Semantic widget descriptor from ui_control__snapshot or ui_control__find."
          properties:
            control_id:
              type: string
              description: "Accessible control ID for semantic targeting."
            window_title:
              type: string
              description: "Containing window title."
        action:
          type: string
          description: "Action: 'click', 'double_click', 'type', 'select', 'toggle', 'right_click'."
          default: click
        value:
          type: string
          description: "Value for 'type' (text to enter) or 'select' (item text)."
    read_only: false
    destructive: true
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 20
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true
    source_file: scripts/interact_widget.py
    call_examples:
      - arguments:
          instance: "maya.abcd1234"
          session_id: "save-scene-1"
          widget:
            control_id: "saveButton"
          action: "click"
        note: "Click Save button by control ID"
      - arguments:
          instance: "maya.abcd1234"
          session_id: "save-scene-2"
          widget:
            control_id: "fileNameField"
          action: "type"
          value: "scene_v002.ma"
        note: "Set non-sensitive text through a semantic control"

  - name: wait_for_ui
    description: >-
      Poll until a widget appears or disappears. Use to synchronize with
      dialogs, progress windows, or loading states. Returns the widget
      descriptor when found.
    input_schema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: "Widget text, type, or role to wait for."
        condition:
          type: string
          description: "'appears' (default) or 'disappears'."
          default: appears
        timeout_secs:
          type: integer
          description: "Maximum seconds to wait (default 30)."
          default: 30
        poll_interval_ms:
          type: integer
          description: "Milliseconds between polls (default 500)."
          default: 500
        window_title:
          type: string
          description: "Limit search to this window."
    read_only: true
    destructive: false
    idempotent: true
    execution: sync
    affinity: any
    timeout_hint_secs: 35
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true
    source_file: scripts/wait_for_ui.py
    call_examples:
      - arguments:
          query: "Render Complete"
          timeout_secs: 120
        note: "Wait up to 2 minutes for render completion dialog"
      - arguments:
          query: "Loading"
          condition: "disappears"
          timeout_secs: 60
        note: "Wait for loading indicator to disappear"

  - name: capture_ui_state
    description: >-
      Capture a comprehensive UI state bundle: screenshot + widget tree +
      window list. The screenshot comes from canonical UI Control capture and
      retains its provenance. Requires an exact DCC instance and session id.
    input_schema:
      type: object
      required: [instance, session_id]
      properties:
        instance:
          type: string
          minLength: 1
          description: "Exact DCC instance short ID or UUID; never inferred."
        session_id:
          type: string
          minLength: 1
          description: "Stable UI Control session ID for this capture."
        window_title:
          type: string
          description: "Focus on a specific window."
        output_dir:
          type: string
          description: "Directory to save captured artifacts."
        include_raw_tree:
          type: boolean
          description: "Include complete unfiltered widget tree (default false — can be large)."
          default: false
    read_only: true
    destructive: false
    idempotent: false
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: false
      open_world_hint: true
    source_file: scripts/capture_ui_state.py
    call_examples:
      - arguments:
          instance: "maya.abcd1234"
          session_id: "ui-debug-1"
          window_title: "Maya"
          output_dir: "/tmp/ui-debug"
        note: "Capture full Maya UI state for debugging"
      - arguments:
          instance: "blender.abcd1234"
          session_id: "ui-debug-2"
          output_dir: "./ui-evidence"
        note: "Capture all windows' state to local dir"
