[package]
name = "dcc-mcp-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-DCC MCP gateway: aggregation, routing, capability index, REST/MCP dynamic-capability surface (#653/#654/#655) — extracted from dcc-mcp-http"

[dependencies]
# Internal
dcc-mcp-attestation = { workspace = true }
# Keep path overrides where this crate intentionally disables dependency defaults;
# Cargo does not allow an inherited workspace dependency to override that setting.
dcc-mcp-db = { path = "../dcc-mcp-db", default-features = false }
dcc-mcp-models = { workspace = true }
dcc-mcp-actions = { workspace = true }
dcc-mcp-gateway-core = { workspace = true }
dcc-mcp-gateway-admin = { workspace = true }
dcc-mcp-jsonrpc = { workspace = true }
dcc-mcp-naming = { workspace = true }
dcc-mcp-transport = { workspace = true }
dcc-mcp-telemetry = { workspace = true, optional = true }
dcc-mcp-skill-rest = { workspace = true }
dcc-mcp-skills = { path = "../dcc-mcp-skills", default-features = false }
dcc-mcp-catalog = { workspace = true }
dcc-mcp-marketplace = { workspace = true }
dcc-mcp-updater = { workspace = true }
dcc-mcp-workflow = { workspace = true }
opentelemetry = { version = "0.32", features = ["trace"], optional = true }
prometheus = { version = "0.14", default-features = false, optional = true }

# Workspace shared
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
base64 = { workspace = true }
toon-format = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
socket2 = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP server
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
sysinfo = { workspace = true }
http.workspace = true
futures.workspace = true
futures-util = { workspace = true }
slab = "0.4"
tokio-stream = { version = "0.1", features = ["sync", "tokio-util"] }

# `nucleo-matcher` backs fuzzy capability search via the `dcc-mcp-gateway-search`
# crate (transitive through `dcc-mcp-gateway-core`).

lru = "0.15"

workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
# No default features: the Prometheus exporter is opt-in via the root
# `prometheus` feature (issue #2182). Keeping it out of `default` means the
# default wheel path no longer compiles the Prometheus exporter. The OTel core
# (opentelemetry / opentelemetry_sdk / opentelemetry-stdout) still compiles via
# `dcc-mcp-telemetry`; opt-in gating of the OTel stack is a separate follow-up.
default = []
admin = ["dcc-mcp-gateway-admin/embed"]
admin-persist-sqlite = ["admin", "dcc-mcp-gateway-admin/persist-sqlite"]
telemetry = ["dep:dcc-mcp-telemetry", "dep:opentelemetry"]
prometheus = ["telemetry", "dcc-mcp-telemetry/prometheus", "dep:prometheus"]
mdns = ["dcc-mcp-transport/mdns"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
criterion = { version = "0.8", features = ["html_reports"] }
tower = { workspace = true, features = ["util"] }
proptest = "1.5"
dcc-mcp-test-utils = { workspace = true }

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "instance_query_bench"
harness = false
