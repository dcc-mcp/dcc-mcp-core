[package]
name = "dcc-mcp-skill-rest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Per-DCC RESTful skill API surface (issues #658, #660) — extracted from dcc-mcp-http"

[dependencies]
# Internal
dcc-mcp-actions = { workspace = true }
dcc-mcp-models = { workspace = true }
dcc-mcp-skills = { workspace = true }
dcc-mcp-gateway-search = { workspace = true }

# Workspace shared
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# HTTP server
axum = { workspace = true, features = ["http1", "tokio"] }

# Async + SSE streaming (#818 phase 1b)
futures.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# OpenAPI generation
utoipa = { version = "5.4", features = ["axum_extras"] }
utoipa-scalar = "0.3"
axum-test = { version = "20", optional = true }

workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
axum-test = "20"
dcc-mcp-test-utils = { workspace = true }

[features]
default = []
test-fixtures = ["dep:axum-test"]
