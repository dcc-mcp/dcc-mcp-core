# Versioned host manifest for `dcc-mcp-cli host`.
#
# This file is the SINGLE SOURCE OF TRUTH for host versions. Install, upgrade
# and rollback all read the version from here (or from the user-level lock that
# pins a subset of these ids). A version that appears in a prompt, a chat
# transcript, or a cached report is never trusted: PIP-2387 shipped a broken
# artifact because a version was carried in context instead of read from the
# manifest.
#
# Field reference
#   id              Canonical lowercase host id used by `host doctor <spec>`.
#   display_name    Human-readable name.
#   license         open_source | commercial.
#   self_provision  True only for free/open-source hosts with a scripted
#                   install channel. Commercial hosts MUST stay false: they
#                   need a licence and the CLI must never install one.
#   min_version     Lowest version the ecosystem accepts. Omitted means "any".
#   pinned_version  Exact version `host install` provisions and `host pin`
#                   records. Required when self_provision is true.
#   executables     Platform binary names, searched on PATH.
#   version_arg     argv used to ask the binary for its version. Empty means
#                   the version is not queried and no version gate is applied.
#   search_roots    Platform install locations. Supports `*` and `?` per path
#                   segment. Read-only: nothing is ever created here.
#   install         Platform install channels, consumed by `host install`.
#
# Environment override: `DCC_MCP_<ID>_EXECUTABLE` (e.g. DCC_MCP_BLENDER_EXECUTABLE)
# always wins over both PATH and search_roots, so a studio can point the CLI at
# a non-standard layout without editing this file.

version: "1"
hosts:
  # ── Open source, self-provisionable ────────────────────────────────────────
  - id: blender
    display_name: Blender
    license: open_source
    self_provision: true
    # hallong 2026-09-25: every Blender the ecosystem touches is >= 5.1.
    min_version: "5.1"
    pinned_version: "5.1.1"
    executables:
      windows: ["blender.exe"]
      macos: ["Blender", "blender"]
      linux: ["blender"]
    version_arg: ["--version"]
    search_roots:
      windows:
        - 'C:\Program Files\Blender Foundation\Blender *\blender.exe'
      macos:
        - '/Applications/Blender.app/Contents/MacOS/Blender'
      linux:
        - '/usr/bin/blender'
        - '/usr/local/bin/blender'
        - '/snap/bin/blender'
        - '/var/lib/flatpak/exports/bin/org.blender.Blender'
    install:
      windows:
        kind: winget
        id: "Blender.Blender"
      macos:
        kind: brew
        cask: "blender"
      linux:
        kind: tarball
        url: "https://mirrors.iu13.net/blender/release/Blender5.1/blender-5.1.1-linux-x64.tar.xz"
        sha256_url: "https://mirrors.iu13.net/blender/release/Blender5.1/blender-5.1.1-linux-x64.tar.xz.sha256"
        strip_components: 1

  # ── Open source, probing supported; install channels land per host ─────────
  # These are free and scriptable in principle, but no install channel is
  # declared yet. `host doctor` reports them; `host install` refuses with
  # `no_install_channel` until a channel is added here.
  - id: godot
    display_name: Godot
    license: open_source
    self_provision: false
    executables:
      windows: ["godot.exe"]
      macos: ["Godot", "godot"]
      linux: ["godot"]
    version_arg: ["--version"]
    search_roots:
      windows:
        - 'C:\Program Files\Godot\Godot.exe'
        - 'C:\Program Files\Godot*\Godot.exe'
      macos:
        - '/Applications/Godot*.app/Contents/MacOS/Godot'
      linux:
        - '/usr/bin/godot'
        - '/usr/local/bin/godot'

  - id: kdenlive
    display_name: Kdenlive
    license: open_source
    self_provision: false
    executables:
      windows: ["kdenlive.exe"]
      macos: ["kdenlive"]
      linux: ["kdenlive"]
    version_arg: ["--version"]
    search_roots:
      linux:
        - '/usr/bin/kdenlive'
        - '/usr/local/bin/kdenlive'
        - '/var/lib/flatpak/exports/bin/org.kde.kdenlive'

  - id: obs
    display_name: OBS Studio
    license: open_source
    self_provision: false
    executables:
      windows: ["obs64.exe"]
      macos: ["OBS", "obs"]
      linux: ["obs"]
    version_arg: ["--version"]
    search_roots:
      windows:
        - 'C:\Program Files\obs-studio\bin\64bit\obs64.exe'
      macos:
        - '/Applications/OBS.app/Contents/MacOS/OBS'
      linux:
        - '/usr/bin/obs'
        - '/var/lib/flatpak/exports/bin/com.obsproject.Studio'

  # ── Commercial: probe and report, NEVER install ────────────────────────────
  # Licence-gated hosts. `host install` must refuse these and tell the user to
  # install the host themselves. `self_provision` false is enforced by manifest
  # validation, so a typo here fails the load instead of silently installing.
  - id: maya
    display_name: Autodesk Maya
    license: commercial
    self_provision: false
    executables:
      windows: ["maya.exe"]
      macos: ["maya"]
      linux: ["maya"]
    search_roots:
      windows:
        - 'C:\Program Files\Autodesk\Maya*\bin\maya.exe'
      macos:
        - '/Applications/Autodesk/maya*/Maya.app/Contents/bin/maya'
      linux:
        - '/usr/autodesk/maya*/bin/maya'

  - id: 3dsmax
    display_name: Autodesk 3ds Max
    license: commercial
    self_provision: false
    executables:
      windows: ["3dsmax.exe"]
    search_roots:
      windows:
        - 'C:\Program Files\Autodesk\3ds Max *\3dsmax.exe'

  - id: houdini
    display_name: SideFX Houdini
    license: commercial
    self_provision: false
    executables:
      windows: ["houdini.exe"]
      macos: ["houdini"]
      linux: ["houdini"]
    search_roots:
      windows:
        - 'C:\Program Files\Side Effects Software\Houdini *\bin\houdini.exe'
      macos:
        - '/Applications/Houdini/Houdini*/Frameworks/Houdini.framework/Versions/Current/Resources/bin/houdini'
      linux:
        - '/opt/hfs*/bin/houdini'

  - id: nuke
    display_name: Foundry Nuke
    license: commercial
    self_provision: false
    executables:
      windows: ["Nuke.exe"]
      macos: ["Nuke"]
      linux: ["Nuke"]
    search_roots:
      windows:
        - 'C:\Program Files\Nuke*\Nuke*.exe'
      macos:
        - '/Applications/Nuke*/Nuke*.app/Contents/MacOS/Nuke*'
      linux:
        - '/opt/Nuke*/Nuke*'

  - id: photoshop
    display_name: Adobe Photoshop
    license: commercial
    self_provision: false
    executables:
      windows: ["Photoshop.exe"]
      macos: ["Adobe Photoshop"]
    search_roots:
      windows:
        - 'C:\Program Files\Adobe\Adobe Photoshop *\Photoshop.exe'
      macos:
        - '/Applications/Adobe Photoshop */Adobe Photoshop *.app/Contents/MacOS/Adobe Photoshop *'

  - id: substance
    display_name: Adobe Substance 3D Painter
    license: commercial
    self_provision: false
    executables:
      windows: ["Substance 3D Painter.exe"]
      macos: ["Substance 3D Painter"]
    search_roots:
      windows:
        - 'C:\Program Files\Adobe\Adobe Substance 3D Painter\Substance 3D Painter.exe'
      macos:
        - '/Applications/Adobe Substance 3D Painter/Substance 3D Painter.app/Contents/MacOS/Substance 3D Painter'
