[package]
name = "dcc-mcp-gateway-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Admin domain and embedded frontend boundary for the DCC-MCP gateway."
build = "build.rs"

[lints]
workspace = true

[dependencies]
axum.workspace = true
chrono = { version = "0.4", features = ["serde"] }
dcc-mcp-catalog.workspace = true
dcc-mcp-db = { path = "../dcc-mcp-db", default-features = false, optional = true }
dcc-mcp-models.workspace = true
dcc-mcp-transport.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
default = []
embed = []
persist-sqlite = ["dep:dcc-mcp-db", "dcc-mcp-db/gateway-admin-sqlite"]

[build-dependencies]
dunce = "1.0"

[dev-dependencies]
dcc-mcp-test-utils.workspace = true
proptest = "1.5"
tempfile.workspace = true
